<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitaliy · Translation Workout VI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f0; --surface:#ffffff; --surface2:#eceee8; --ink:#1c2230; --muted:#5d6574;
  --line:#d9dcd3; --accent:#2c5a86; --accent-ink:#ffffff; --mark:#f3d47a;
  --ok:#2d7a4c; --ok-bg:#e3f1e8; --bad:#b0413a; --bad-bg:#f8e5e3;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15181f; --surface:#1d212b; --surface2:#252a36; --ink:#e7e9ee; --muted:#9aa2b1;
    --line:#333a48; --accent:#7fb0e0; --accent-ink:#10141b; --mark:#6b5a24;
    --ok:#7ccf9c; --ok-bg:#1c3326; --bad:#f09a92; --bad-bg:#3a2020;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181f; --surface:#1d212b; --surface2:#252a36; --ink:#e7e9ee; --muted:#9aa2b1;
  --line:#333a48; --accent:#7fb0e0; --accent-ink:#10141b; --mark:#6b5a24;
  --ok:#7ccf9c; --ok-bg:#1c3326; --bad:#f09a92; --bad-bg:#3a2020;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,4vw,2rem);margin:2px 0 4px;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;font:600 .85rem var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button .n{color:var(--muted);font-weight:500;margin-right:4px;font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button[aria-selected="true"] .n{color:inherit;opacity:.75}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{padding-top:18px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:6px}
.phead h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0}
.meta{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.instr{margin:0 0 16px;color:var(--muted);max-width:68ch}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:flex-start}
.q .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;min-width:1.6em}
.q .txt{font-family:var(--serif);font-size:1.05rem;flex:1}
.sub{color:var(--muted);font-family:var(--serif)}
.sub.wrongline{color:var(--ink)}
.lbl{font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.key{font:700 .75rem var(--sans);letter-spacing:.04em;background:var(--mark);color:var(--ink);padding:2px 7px;border-radius:4px;white-space:nowrap}
.body{padding-left:calc(1.6em + 10px);display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{font:500 .95rem var(--serif);text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts{display:flex;flex-direction:column;gap:6px}
input.gap{font:500 1rem var(--sans);padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);width:min(100%,260px)}
input.gap.inl{width:min(100%,190px);margin:2px 2px}
.ok-f{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.bad-f{border-color:var(--bad)!important;background:var(--bad-bg)!important}
textarea{font:1rem var(--sans);width:100%;min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);resize:vertical}
.btn{font:600 .85rem var(--sans);padding:6px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.fb:empty{display:none}
.fb{font-size:.93rem}
.good{color:var(--ok);font-weight:600}
.wrong{color:var(--bad);font-weight:600}
.ru{color:var(--muted)}
.model{background:var(--surface2);border-radius:6px;padding:8px 10px;font-family:var(--serif)}
.model small{display:block;font-family:var(--sans);color:var(--muted);margin-top:4px}
.inline{font-family:var(--serif);font-size:1.05rem;line-height:2.1}
.inline i{color:var(--muted)}
.pool,.built{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:6px;border-radius:8px}
.built{border:1px dashed var(--line);background:var(--surface2)}
.built.ok-f,.built.bad-f{border-style:solid}
.tile{font:500 .98rem var(--serif);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:6px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:999px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px}
.half{display:flex;flex-direction:column;gap:6px}
.words{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--serif);font-size:1.05rem}
.w{border:1px solid transparent;background:none;color:var(--ink);font:inherit;padding:1px 4px;border-radius:4px;cursor:pointer}
.w:hover{border-color:var(--line);background:var(--surface2)}
.w.hit{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.w.miss{color:var(--muted)}
.btn.listen{font-size:.75rem;padding:2px 8px;vertical-align:middle}
.who{display:inline-block;font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:8px}
.item.alt{margin-left:clamp(0px,4vw,28px)}
.choice{display:inline-flex;flex-wrap:wrap;gap:4px;margin:0 3px;vertical-align:middle}
.ch{font:500 .95rem var(--serif);border:1px dashed var(--accent);background:var(--surface2);color:var(--ink);padding:1px 8px;border-radius:5px;cursor:pointer}
.ch.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.ch.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.ch.off{opacity:.35;text-decoration:line-through;cursor:default}
.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.match .col{display:flex;flex-direction:column;gap:6px}
.card{font:1rem var(--serif);text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.card.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.card.bad{border-color:var(--bad);background:var(--bad-bg)}
.start{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--serif);font-size:1.05rem}
.lead{font-weight:600}
input.gap.wide{width:min(100%,520px);flex:1 1 260px}
.src{display:flex;flex-direction:column;gap:4px;font-family:var(--serif);font-size:1.03rem;line-height:1.7}
.para{gap:2px 0}
.found{display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.found:empty{display:none}
.pair{font-family:var(--serif)}
.pair s{color:var(--bad)}
.art-title{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0}
.dir{font:700 .7rem var(--sans);letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.timerbar{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.clock{font:700 1.4rem var(--sans);font-variant-numeric:tabular-nums;color:var(--accent)}
.clock.over{color:var(--bad)}
.speed{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item.tight{gap:6px;padding:10px 12px}
.item.tight input.gap{flex:1 1 140px;width:auto;min-width:0}
.opt.half-w{width:auto;flex:1 1 140px;text-align:center;font-family:var(--sans);font-weight:600}
.opt.bad-pick{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.skel{font:600 1rem ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--accent);background:var(--surface2);border-radius:6px;padding:8px 10px;word-spacing:.2em;overflow-wrap:anywhere}
.step{display:flex;flex-direction:column;gap:6px}
.step-l{display:block;margin-top:4px}
.sub.mt{color:var(--ink);text-decoration:underline wavy var(--bad);text-decoration-thickness:1px;text-underline-offset:4px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Translation Masterclass · part 7</div>
    <h1>Translation Workout VI</h1>
    <p>Vitaliy · 5 November · new word list · focus: impersonal passive, inversion, mixed conditionals · 8 formats · about 90 minutes</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="panels"></main>
</div>

<script>
/* =========================================================
   Answer patterns: {a|b} = one of the options, [x] = optional.
   Checking ignores case, punctuation, contractions and UK/US spelling.
   ========================================================= */

/* ---------- Format 1: speed round ---------- */
const E1=[
 ["внести вклад в науку",["contribute to science","make a contribution to science"],"contribute to science","Contribute to sth / make a contribution to sth."],
 ["снизить цены",["{lower|reduce|cut} [the ]prices"],"lower the prices","Lower — глагол «снижать»."],
 ["северный город",["[a ]northern {city|town}"],"a northern city","Прилагательное — northern."],
 ["другим способом",["in {another|a different} way","differently"],"in another way","In another way — по-другому."],
 ["представить себе такую красоту",["imagine such beauty"],"imagine such beauty","Imagine sth — без предлога. Beauty — без артикля."],
 ["любовь с первого взгляда",["love at first sight"],"love at first sight","At first sight — с первого взгляда."],
 ["почти всегда",["{almost|nearly} always"],"almost always","Almost always."],
 ["долгое время",["for a long time"],"for a long time","For a long time — долго, долгое время."],
 ["возмутительная цена",["[an ]outrageous price"],"an outrageous price","Outrageous — возмутительный."],
 ["огромная поддержка",["[an ]overwhelming support","overwhelming support"],"overwhelming support","Overwhelming — подавляющий, огромный."],
 ["фильм длится два часа",["the {film|movie} lasts [for ]2 hours"],"the film lasts two hours","Last — длиться."],
 ["потратить все время на работу",["spend all {the|my|his|her|your|} time {on work|working}"],"spend all the time on work","Spend time on sth / spend time doing sth."],
 ["Так и есть.",["it is so","that is so","so it is"],"It is so.","It is so — так и есть."],
 ["неизбежная потеря",["[an ]inevitable loss"],"an inevitable loss","Inevitable — неизбежный. Loss — потеря."],
 ["дорогой стул",["[an ]expensive chair"],"an expensive chair","Дорогой предмет — expensive."],
 ["высокие цены",["high prices"],"high prices","Цены — high, не expensive."],
 ["экономический рост",["economic growth","[the ]growth of the economy"],"economic growth","Рост (увеличение) — growth."],
 ["подвезти ученого",["give the scientist a {lift|ride}","give a {lift|ride} to the scientist"],"give the scientist a lift","Give sb a lift."],
 ["воображаемый мир",["[an |the ]imaginary world"],"an imaginary world","Imaginary — несуществующий, воображаемый."],
 ["удивительная красота",["surprising beauty"],"surprising beauty","Surprising — удивительный."]
];

/* ---------- Format 2: odd one out (last option is the wrong one) ---------- */
const E2=[
 ["Говорят, что этот ученый внес огромный вклад в науку.",["This scientist is said to have made a huge contribution to science.","It is said that this scientist has made a huge contribution to science.","This scientist is said to have contributed a lot to science.","This scientist says to have made a huge contribution to science."],"«Говорят» — пассив: is said to. «Says to have made» — ошибка."],
 ["Если бы он тогда принял другое решение, он бы сейчас жил на севере.",["If he had made a different decision then, he would be living in the north now.","Had he made a different decision then, he would be living in the north now.","If he had made another decision back then, he would live in the north now.","If he made a different decision then, he would have lived in the north now."],"Смешанный тип: условие в прошлом (had made), результат сейчас (would live / would be living)."],
 ["Никогда я не видел такого прекрасного зрелища.",["Never have I seen such a beautiful sight.","I have never seen such a beautiful sight.","Never before have I seen such a beautiful sight.","Never I have seen such a beautiful sight."],"Never в начале требует инверсии: have I seen."],
 ["Цены здесь возмутительно высокие.",["The prices here are outrageously high.","Prices here are outrageously high.","The prices here are outrageous.","The prices here are outrageously expensive."],"Цены бывают high, а expensive — это вещи."],
 ["Ожидается, что встреча продлится три часа.",["The meeting is expected to last three hours.","It is expected that the meeting will last three hours.","The meeting is expected to last for three hours.","The meeting is expecting to last three hours."],"Ожидается — пассив: is expected to."],
 ["Не успела она примерить платье, как ей сделали комплимент.",["No sooner had she tried on the dress than she was paid a compliment.","Hardly had she tried on the dress when she was paid a compliment.","No sooner had she tried the dress on than someone paid her a compliment.","No sooner she had tried on the dress than she was paid a compliment."],"После No sooner — инверсия: had she tried."],
 ["Мы долго молчали.",["We were silent for a long time.","We kept silent for a long time.","For a long time we said nothing.","We were silence for a long time."],"Silence — существительное. Молчать — be silent."],
 ["Если бы не его поддержка, мы бы проиграли.",["If it hadn't been for his support, we would have lost.","Had it not been for his support, we would have lost.","Without his support, we would have lost.","Hadn't it been for his support, we would have lost."],"В инверсии отрицание без сокращения: Had it not been for…"]
];

/* ---------- Format 3: partial translation ---------- */
const E3=[
 "{Говорят|it is said/it's said} that the {рост|growth} of prices {продлится|will last} until spring.",
 "{Если бы ты меня подвез|if you had given me a lift/had you given me a lift/if you had given me a ride/had you given me a ride} yesterday, I {не была бы сейчас такой уставшей|would not be so tired now/wouldn't be so tired now/would not be so tired/wouldn't be so tired}.",
 "{Редко|rarely/seldom} {можно увидеть|can you see/do you see/can one see/does one see} such a beautiful {зрелище|sight}.",
 "The scientist {считается|is believed/is considered/is thought} {внесшим большой вклад|to have made a great contribution/to have made a huge contribution/to have made a big contribution/to have contributed a lot} to modern science.",
 "The {северные|northern} regions {вряд ли|are unlikely to} {снизят|lower/reduce/cut} their prices.",
 "{Примерив|having tried on} the coat, she decided that it was {возмутительно дорогим|outrageously expensive}.",
 "{Ни при каких обстоятельствах|under no circumstances} {не отвечай на|should you answer} his questions {на повышенных тонах|in raised voices/in a raised voice}.",
 "The loss was {неизбежной|inevitable}, but the support of his friends was {огромной|overwhelming}."
];

/* ---------- Format 4: accurate or not ---------- */
const REASONS=["Tense / aspect","Active / passive","Word choice","Preposition","Word order"];
const E4=[
 ["Он внес вклад в развитие науки.","He contributed in the development of science.",false,3,"Contribute to sth: He contributed to the development of science."],
 ["Говорят, что встреча длилась пять часов.","The meeting is said to have lasted five hours.",true,null,"Безличный пассив и перфектный инфинитив — все верно."],
 ["Если бы он не потратил все деньги, он бы сейчас купил это кресло.","If he hadn't spent all the money, he would have bought this chair now.",false,0,"Результат сейчас (now) — смешанный тип: he would buy this chair now."],
 ["Не успел он ответить, как наступила тишина.","No sooner had he answered than there was silence.",true,null,"No sooner had… than — все верно."],
 ["Цены здесь очень дорогие.","The prices here are very expensive.",false,2,"Цены — high: The prices here are very high."],
 ["Редко можно услышать такие неискренние комплименты.","Rarely you can hear such insincere compliments.",false,4,"После Rarely в начале — инверсия: Rarely can you hear…"],
 ["Ожидается, что цены снизят.","Prices are expected to lower.",false,1,"Цены снизят (их снизит кто-то) — пассивный инфинитив: Prices are expected to be lowered."],
 ["Мне интересна наука.","I am interesting in science.",false,2,"О человеке — interested in: I am interested in science."],
 ["Считается, что эта потеря была неизбежной.","This loss is believed to have been inevitable.",true,null,"Is believed to have been — все верно."],
 ["Так и есть: его рост — два метра.","It is so: his high is two metres.",false,2,"Рост человека — height: his height is two metres (или he is two metres tall)."]
];

/* ---------- Format 5: translation decisions ---------- */
const E5=[
 ["Если бы мы тогда снизили цены, мы бы сейчас не несли таких потерь.",
  ["Which conditional?",["Mixed conditional","Third conditional","Second conditional"],0,"Условие в прошлом (тогда), результат сейчас — смешанный тип."],
  ["«снизили» =",["lowered","lowed","fell"],0,"Lower — снижать (правильный глагол: lowered)."],
  ["{if we had lowered|had we lowered} [the |our ]prices[ then][ back then] we would not {be suffering|suffer|have|be having} such [big |heavy |huge ]losses[ now]","{if we had lowered|had we lowered} [the |our ]prices[ then][ back then] we would not now {be suffering|suffer|have} such [big |heavy |huge ]losses"],
  "If we had lowered the prices then, we would not be suffering such losses now."],
 ["Говорят, что зрелище было ошеломляющим.",
  ["Which structure?",["is said to have been","is said to be","says to have been"],0,"Прошлое после «говорят» — перфектный инфинитив: to have been."],
  ["«зрелище» =",["sight","sightseeing","vision"],0,"Sight — зрелище, вид."],
  ["the sight is said to have been overwhelming","it is said that the sight was overwhelming"],
  "The sight is said to have been overwhelming."],
 ["Только тогда я понял, насколько неизбежной была эта потеря.",
  ["Which word order?",["Only then did I realise","Only then I realised","Only then had I realise"],0,"После Only then — инверсия с did."],
  ["«неизбежной» =",["inevitable","inevitably","unavoidably"],0,"После was — прилагательное: inevitable."],
  ["only then did i {realize|understand} how inevitable {this|that|the} loss {was|had been}"],
  "Only then did I realise how inevitable this loss was."],
 ["Если бы ты сказал мне правду, я бы ответил по-другому. (без if)",
  ["Which structure without if?",["Had you told me","Should you tell me","Were you to tell me"],0,"Третий тип с инверсией: Had you told me…"],
  ["«по-другому» =",["in another way","by other way","in other way"],0,"In another way / in a different way."],
  ["had you told me the truth i would have answered {in another way|in a different way|differently}"],
  "Had you told me the truth, I would have answered in another way."],
 ["Ожидается, что рост продлится еще год.",
  ["Which structure?",["is expected to","is expecting to","expects to"],0,"Безличный пассив: is expected to + V."],
  ["«продлится» =",["last","long","continue on"],0,"Last — длиться."],
  ["[the ]growth is expected to {last|continue} [for ]{another|one more} year","it is expected that [the ]growth will {last|continue} [for ]{another|one more} year"],
  "Growth is expected to last another year."],
 ["Они и представить себе не могли, насколько огромной окажется поддержка.",
  ["Which structure?",["Little did they imagine","Little they imagined","Little had they imagine"],0,"Little в начале — инверсия: Little did they imagine."],
  ["«огромной» =",["overwhelming","overwhelmed","overwhelm"],0,"Поддержка сама по себе огромная — overwhelming."],
  ["little did they imagine how overwhelming the support would {be|turn out to be|prove to be}"],
  "Little did they imagine how overwhelming the support would be."]
];

/* ---------- Format 6: first letters ---------- */

/* ======================= CHECKING ======================= */
const SPELL={realise:"realize",realised:"realized",neighbour:"neighbor",neighbours:"neighbors",cancelling:"canceling",cancelled:"canceled",quarrelling:"quarreling",favour:"favor",gotten:"got",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",nine:"9",eight:"8",ten:"10",fifteenth:"15th",seventeenth:"17th",xvii:"17th",xv:"15th"};
const spellRe=new RegExp("\\b("+Object.keys(SPELL).join("|")+")\\b","g");
const PP=/^(been|had|made|got|done|gone|come|left|felt|kept|said|told|stuck|bought|thought|brought|built|sent|spent|lost|met|paid|heard|put|let|set|seen|known|taken|given|written|already|never|just|finished|\w+ed)$/;
function baseClean(s){return s.toLowerCase().replace(/[’`ʼ]/g,"'").replace(/[-–—]/g," ").replace(/[.,!?;:"“”«»…()]/g," ").replace(/o'clock/g,"oclock").replace(spellRe,m=>SPELL[m]).replace(/\s+/g," ").trim();}
function normInput(s){
  s=baseClean(s).replace(/won't/g,"will not").replace(/can't/g,"cannot").replace(/can not/g,"cannot").replace(/n't/g," not").replace(/'ll/g," will").replace(/'re/g," are").replace(/'ve/g," have").replace(/'m/g," am");
  const t=s.split(" ");
  for(let i=0;i<t.length;i++){
    const m=t[i].match(/^(\w+)'(d|s)$/);if(!m)continue;const nx=t[i+1]||"";
    if(m[2]==="d")t[i]=m[1]+(nx==="better"||PP.test(nx)?" had":" would");
    else if(/^(due|likely|unlikely|about|expected|said|believed|thought|going|on)$/.test(nx))t[i]=m[1]+" is";
    else if(["it","that","there","what","who","he","she","where","here"].includes(m[1]))t[i]=m[1]+(/^(been|got|gone|had|come|never)$/.test(nx)?" has":" is");
  }
  return t.join(" ").replace(/'/g,"").replace(/\s/g,"");
}
function patRe(p){
  p=baseClean(p.replace(/[{}\[\]|]/g,c=>({"{":"\u0001","}":"\u0002","[":"\u0003","]":"\u0004","|":"\u0005"}[c]))).replace(/'/g,"").replace(/\s/g,"");
  let r="";for(const c of p){r+=c==="\u0001"?"(?:":c==="\u0002"?")":c==="\u0003"?"(?:":c==="\u0004"?")?":c==="\u0005"?"|":c.replace(/[.*+?^$()\\\/]/g,"\\$&");}
  return new RegExp("^"+r+"$");
}
function matches(input,patterns){const v=normInput(input);if(!v)return null;return patterns.some(p=>patRe(p).test(v));}

const $=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}kids.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e;};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const scores={};
function scoreEl(id,total){const s=$("span",{class:"meta"});scores[id]={ok:new Set(),total,el:s};upd(id);return s;}

function mark(id,i){scores[id]&&(scores[id].ok.add(i),upd(id));}
