<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitaliy · Translation Workout VII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f0; --surface:#ffffff; --surface2:#eceee8; --ink:#1c2230; --muted:#5d6574;
  --line:#d9dcd3; --accent:#2c5a86; --accent-ink:#ffffff; --mark:#f3d47a;
  --ok:#2d7a4c; --ok-bg:#e3f1e8; --bad:#b0413a; --bad-bg:#f8e5e3;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15181f; --surface:#1d212b; --surface2:#252a36; --ink:#e7e9ee; --muted:#9aa2b1;
    --line:#333a48; --accent:#7fb0e0; --accent-ink:#10141b; --mark:#6b5a24;
    --ok:#7ccf9c; --ok-bg:#1c3326; --bad:#f09a92; --bad-bg:#3a2020;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181f; --surface:#1d212b; --surface2:#252a36; --ink:#e7e9ee; --muted:#9aa2b1;
  --line:#333a48; --accent:#7fb0e0; --accent-ink:#10141b; --mark:#6b5a24;
  --ok:#7ccf9c; --ok-bg:#1c3326; --bad:#f09a92; --bad-bg:#3a2020;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,4vw,2rem);margin:2px 0 4px;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;font:600 .85rem var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button .n{color:var(--muted);font-weight:500;margin-right:4px;font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button[aria-selected="true"] .n{color:inherit;opacity:.75}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{padding-top:18px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:6px}
.phead h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0}
.meta{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.instr{margin:0 0 16px;color:var(--muted);max-width:68ch}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:flex-start}
.q .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;min-width:1.6em}
.q .txt{font-family:var(--serif);font-size:1.05rem;flex:1}
.sub{color:var(--muted);font-family:var(--serif)}
.sub.wrongline{color:var(--ink)}
.lbl{font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.key{font:700 .75rem var(--sans);letter-spacing:.04em;background:var(--mark);color:var(--ink);padding:2px 7px;border-radius:4px;white-space:nowrap}
.body{padding-left:calc(1.6em + 10px);display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{font:500 .95rem var(--serif);text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts{display:flex;flex-direction:column;gap:6px}
input.gap{font:500 1rem var(--sans);padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);width:min(100%,260px)}
input.gap.inl{width:min(100%,190px);margin:2px 2px}
.ok-f{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.bad-f{border-color:var(--bad)!important;background:var(--bad-bg)!important}
textarea{font:1rem var(--sans);width:100%;min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);resize:vertical}
.btn{font:600 .85rem var(--sans);padding:6px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.fb:empty{display:none}
.fb{font-size:.93rem}
.good{color:var(--ok);font-weight:600}
.wrong{color:var(--bad);font-weight:600}
.ru{color:var(--muted)}
.model{background:var(--surface2);border-radius:6px;padding:8px 10px;font-family:var(--serif)}
.model small{display:block;font-family:var(--sans);color:var(--muted);margin-top:4px}
.inline{font-family:var(--serif);font-size:1.05rem;line-height:2.1}
.inline i{color:var(--muted)}
.pool,.built{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:6px;border-radius:8px}
.built{border:1px dashed var(--line);background:var(--surface2)}
.built.ok-f,.built.bad-f{border-style:solid}
.tile{font:500 .98rem var(--serif);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:6px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:999px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px}
.half{display:flex;flex-direction:column;gap:6px}
.words{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--serif);font-size:1.05rem}
.w{border:1px solid transparent;background:none;color:var(--ink);font:inherit;padding:1px 4px;border-radius:4px;cursor:pointer}
.w:hover{border-color:var(--line);background:var(--surface2)}
.w.hit{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.w.miss{color:var(--muted)}
.btn.listen{font-size:.75rem;padding:2px 8px;vertical-align:middle}
.who{display:inline-block;font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:8px}
.item.alt{margin-left:clamp(0px,4vw,28px)}
.choice{display:inline-flex;flex-wrap:wrap;gap:4px;margin:0 3px;vertical-align:middle}
.ch{font:500 .95rem var(--serif);border:1px dashed var(--accent);background:var(--surface2);color:var(--ink);padding:1px 8px;border-radius:5px;cursor:pointer}
.ch.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.ch.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.ch.off{opacity:.35;text-decoration:line-through;cursor:default}
.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.match .col{display:flex;flex-direction:column;gap:6px}
.card{font:1rem var(--serif);text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.card.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.card.bad{border-color:var(--bad);background:var(--bad-bg)}
.start{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--serif);font-size:1.05rem}
.lead{font-weight:600}
input.gap.wide{width:min(100%,520px);flex:1 1 260px}
.src{display:flex;flex-direction:column;gap:4px;font-family:var(--serif);font-size:1.03rem;line-height:1.7}
.para{gap:2px 0}
.found{display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.found:empty{display:none}
.pair{font-family:var(--serif)}
.pair s{color:var(--bad)}
.art-title{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0}
.dir{font:700 .7rem var(--sans);letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.timerbar{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.clock{font:700 1.4rem var(--sans);font-variant-numeric:tabular-nums;color:var(--accent)}
.clock.over{color:var(--bad)}
.speed{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item.tight{gap:6px;padding:10px 12px}
.item.tight input.gap{flex:1 1 140px;width:auto;min-width:0}
.opt.half-w{width:auto;flex:1 1 140px;text-align:center;font-family:var(--sans);font-weight:600}
.opt.bad-pick{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.skel{font:600 1rem ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--accent);background:var(--surface2);border-radius:6px;padding:8px 10px;word-spacing:.2em;overflow-wrap:anywhere}
.step{display:flex;flex-direction:column;gap:6px}
.step-l{display:block;margin-top:4px}
.sub.mt{color:var(--ink);text-decoration:underline wavy var(--bad);text-decoration-thickness:1px;text-underline-offset:4px}
.opt .lead-in{color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Translation Masterclass · part 8</div>
    <h1>Translation Workout VII</h1>
    <p>Vitaliy · 12 November · new word list · focus: impersonal passive, inversion, mixed conditionals · 8 formats · about 90 minutes</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="panels"></main>
</div>

<script>
/* =========================================================
   Answer patterns: {a|b} = one of the options, [x] = optional.
   Checking ignores case, punctuation, contractions and UK/US spelling.
   ========================================================= */

/* ---------- Format 1: translation traps  {{correct|wrong|wrong}} ---------- */
const G1=[
 ["Это решение повлияло на всю компанию.","This decision {{influenced|influenced on|influenced to}} the whole company.","Influence sth — без предлога. Предлог on есть только у существительного: an influence on sth."],
 ["Я делаю работу по дому каждый день.","I do {{housework|houseworks|homeworks}} every day.","Housework — неисчисляемое, без -s. Homework — домашнее задание."],
 ["Этот дом продается.","This house is {{for sale|on sale|in sale}}.","For sale — продается. On sale — со скидкой (в распродаже) или в продаже в магазинах."],
 ["Принеси мне, пожалуйста, лекарство.","Please {{bring|take|carry}} me the {{medicine|medicines|medicament}}.","Bring — принести (сюда, к говорящему). Medicine в значении «лекарство» обычно неисчисляемое."],
 ["Он живет в Великобритании.","He lives in {{the UK|UK|the United Kingdoms}}.","The UK — с артиклем."],
 ["Сейчас он очень занят.","{{At the moment|In the moment|On the moment}} he is very busy.","At the moment — сейчас, в данный момент."],
 ["Каждый раз, когда мы встречаемся, он опаздывает.","{{Every time|All the time|Each times}} we meet, he is late.","Every time — каждый раз (когда…)."],
 ["Он все время смотрит в телефон.","He looks at his phone {{all the time|every time|all time}}.","All the time — постоянно, все время."],
 ["Мне интересна эта головоломка — она очень интересная.","I am {{interested|interesting}} in this {{puzzle|puzzling}} — it is very {{interesting|interested}}.","Interested — о человеке, interesting — о предмете. Puzzle — головоломка."],
 ["В комнате чувствовалось напряжение. Все были напряжены.","There was {{tension|tense|tenseness}} in the room. Everyone was {{tense|tension|tensed}}.","Tension — существительное (напряжение), tense — прилагательное (напряженный)."],
 ["Грабитель совершил ограбление.","The {{robber|robbery|rober}} committed a {{robbery|robber|rob}}.","Robber — грабитель (человек), robbery — ограбление."],
 ["Вместо того чтобы помочь, он ушел.","{{Instead of helping|Instead helping|Instead to help}}, he left.","Instead of + -ing."],
 ["Так и есть: он действительно ошибся.","{{It is so|It so is|This is so true}}: he did {{indeed|in deed|indeedly}} make a mistake.","It is so — так и есть. Indeed — действительно (he did indeed make — усилительное did)."],
 ["Его рост — 190 см, а температура у него высокая.","His {{height|high|growth}} is 190 cm, and his temperature is {{high|tall}}.","Рост человека — height. Температура, цены — high."],
 ["Это ежедневная газета.","It is a {{daily|everyday|day}} newspaper.","Daily — ежедневный. Everyday — обычный, повседневный."]
];

/* ---------- Format 2: choose the ending ---------- */
const G2=[
 ["Если бы он тогда не совершил эту ошибку, он бы сейчас работал в британской компании.","If he hadn't made that mistake then, he",["would be working for a company in the UK now.","would have worked for a company in the UK now.","will work for a company in the UK now."],0,"Смешанный тип: условие в прошлом, результат сейчас (now) — would be working."],
 ["Говорят, что грабитель сбежал в северные районы.","The robber is said",["to have escaped to the northern regions.","to escape to the northern regions.","that he escaped to the northern regions."],0,"Действие в прошлом — перфектный инфинитив: to have escaped."],
 ["Ни разу за всю игру его соперник не ошибся.","Not once during the whole game",["did his opponent make a mistake.","his opponent made a mistake.","his opponent did make a mistake."],0,"Not once в начале — инверсия: did his opponent make."],
 ["Ожидается, что продажи будут расти год от года.","Sales are expected",["to grow year by year.","growing year by year.","that they will grow year by year."],0,"Is/are expected + to + V."],
 ["Будь я на твоем месте, я бы не отвечал на его неискренние комплименты.","Were I you,",["I wouldn't answer his insincere compliments.","I wouldn't answer to his insincere compliments.","I won't answer his insincere compliments."],0,"Второй тип: would + V. Answer sth — без to."],
 ["Впервые за много лет ученые нашли эффективное лекарство от рака.","For the first time in many years, scientists",["have found an effective medicine for cancer.","have been found an effective medicine for cancer.","has found an effective medicine for the cancer."],0,"Ученые нашли сами — активный залог, have found (scientists — множественное число)."],
 ["Только когда напряжение спало, мы смогли обсудить методологию.","Only when the tension eased",["were we able to discuss the methodology.","we were able to discuss the methodology.","were able we to discuss the methodology."],0,"После Only when + придаточное инверсия идет в главной части: were we able."],
 ["Не успела она закончить работу по дому, как пришли гости.","No sooner had she finished the housework",["than the guests arrived.","when the guests arrived.","than the guests had arrived."],0,"No sooner… than, во второй части Past Simple."]
];

/* ---------- Format 3: match groups ---------- */
const G3=[
 ["impersonal passive",[["Говорят, что это лекарство эффективно.","This medicine is said to be effective."],["Говорят, что это лекарство было эффективным.","This medicine is said to have been effective."],["Говорят, что лекарство тестировали несколько лет.","The medicine is said to have been tested for several years."]]],
 ["mixed conditionals",[["Если бы он не продал компанию, он бы сейчас был богат.","If he hadn't sold the company, he would be rich now."],["Если бы он не продал компанию, он бы тогда разбогател.","If he hadn't sold the company, he would have become rich."],["Если бы он не был таким упрямым, он бы не продал компанию.","If he weren't so stubborn, he wouldn't have sold the company."]]],
 ["inversion",[["Ни разу он не помог с работой по дому.","Not once did he help with the housework."],["Только тогда я понял, что ошибся.","Only then did I realise that I had made a mistake."],["Редко встретишь такого сильного соперника.","Rarely do you meet such a strong opponent."]]],
 ["passive tenses",[["Грабителя сейчас допрашивают.","The robber is being questioned now."],["Грабителя уже арестовали.","The robber has already been arrested."],["К тому времени грабителя уже арестовали.","By then the robber had already been arrested."]]],
 ["future structures",[["Компания вот-вот объявит о распродаже.","The company is about to announce a sale."],["Компания должна объявить о распродаже в пятницу.","The company is due to announce a sale on Friday."],["Компания вряд ли объявит о распродаже.","The company is unlikely to announce a sale."]]]
];

/* ---------- Format 4: two ways ---------- */
const G4=[
 ["Говорят, что эта методология очень эффективна.",
  ["It is said that…",["it is said that this methodology is very effective"],"It is said that this methodology is very effective."],
  ["This methodology is said…",["this methodology is said to be very effective"],"This methodology is said to be very effective."]],
 ["Считается, что грабитель покинул страну.",
  ["It is believed that…",["it is {believed|thought|considered} that the robber {left|has left|had left} the country"],"It is believed that the robber has left the country."],
  ["The robber is believed…",["the robber is {believed|thought|considered} to have left the country"],"The robber is believed to have left the country."]],
 ["Я никогда не видел такого напряжения.",
  ["I have never…",["i have never seen such tension"],"I have never seen such tension."],
  ["Never…",["never have i seen such tension"],"Never have I seen such tension."]],
 ["Он ошибся, и поэтому сейчас у него проблемы. (Если бы он не…)",
  ["If he hadn't…",["if he had not made {a|that|the} mistake he would not {have any problems|have problems|be in trouble}[ now]","if he had not made {a|that|the} mistake he would have no problems[ now]"],"If he hadn't made that mistake, he wouldn't have problems now."],
  ["Had he not…",["had he not made {a|that|the} mistake he would not {have any problems|have problems|be in trouble}[ now]","had he not made {a|that|the} mistake he would have no problems[ now]"],"Had he not made that mistake, he wouldn't have problems now."]],
 ["Не успел он ответить, как его соперник задал новый вопрос.",
  ["Hardly… when",["hardly had he answered when his opponent asked {a new|another} question"],"Hardly had he answered when his opponent asked a new question."],
  ["No sooner… than",["no sooner had he answered than his opponent asked {a new|another} question"],"No sooner had he answered than his opponent asked a new question."]],
 ["Ожидается, что продажи вырастут.",
  ["Sales are expected…",["sales are expected to {grow|rise|increase|go up}"],"Sales are expected to grow."],
  ["It is expected that…",["it is expected that sales will {grow|rise|increase|go up}"],"It is expected that sales will grow."]]
];

/* ---------- Format 5: build ---------- */
const G5=[
 ["Впервые он сам сделал работу по дому.","For the first time he did the housework himself.",[]],
 ["Говорят, что грабителя поймали в Великобритании.","The robber is said to have been caught in the UK.",[]],
 ["Ни при каких обстоятельствах не отвечай на эти письма.","Under no circumstances should you answer these letters.",[]],
 ["Если бы ты меня подвез, я бы сейчас был дома.","If you had given me a lift, I would be at home now.",[]],
 ["Не только цены высокие, но и качество низкое.","Not only are the prices high, but the quality is also low.",[]],
 ["Продажи растут год от года.","Sales are growing year by year.",[]],
 ["Когда получишь письмо, сразу ответь на него.","When you get the letter, answer it immediately.",[]],
 ["Они и не подозревали, что лекарство нашли случайно.","Little did they know that the medicine had been found by chance.",[]],
 ["Технически потери были неизбежны.","Technically, the losses were inevitable.",[]]
];

/* ---------- Format 6: spot & rewrite ---------- */
const G6=[
 ["Его решение сильно повлияло на компанию.","His decision strongly influenced on the company.",4,["his decision strongly influenced the company","his decision influenced the company {strongly|greatly|a lot}","his decision greatly influenced the company"],"His decision strongly influenced the company.","Influence sth — без on."],
 ["Говорят, что ограбление произошло ночью.","The robbery is said to happen at night.",[4,5],["the robbery is said to have happened at night","it is said that the robbery happened at night"],"The robbery is said to have happened at night.","Прошлое — перфектный инфинитив: to have happened."],

const SPELL={realise:"realize",realised:"realized",neighbour:"neighbor",neighbours:"neighbors",cancelling:"canceling",cancelled:"canceled",quarrelling:"quarreling",favour:"favor",gotten:"got",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",nine:"9",eight:"8",ten:"10",fifteenth:"15th",seventeenth:"17th",xvii:"17th",apologising:"apologizing",apologise:"apologize",apologised:"apologized",xv:"15th"};
const spellRe=new RegExp("\\b("+Object.keys(SPELL).join("|")+")\\b","g");
const PP=/^(been|had|made|got|done|gone|come|left|felt|kept|said|told|stuck|bought|thought|brought|built|sent|spent|lost|met|paid|heard|put|let|set|seen|known|taken|given|written|already|never|just|finished|\w+ed)$/;
function baseClean(s){return s.toLowerCase().replace(/[’`ʼ]/g,"'").replace(/[-–—]/g," ").replace(/[.,!?;:"“”«»…()]/g," ").replace(/o'clock/g,"oclock").replace(spellRe,m=>SPELL[m]).replace(/\s+/g," ").trim();}
function normInput(s){
  s=baseClean(s).replace(/won't/g,"will not").replace(/can't/g,"cannot").replace(/can not/g,"cannot").replace(/n't/g," not").replace(/'ll/g," will").replace(/'re/g," are").replace(/'ve/g," have").replace(/'m/g," am");
  const t=s.split(" ");
  for(let i=0;i<t.length;i++){
    const m=t[i].match(/^(\w+)'(d|s)$/);if(!m)continue;const nx=t[i+1]||"";
    if(m[2]==="d")t[i]=m[1]+(nx==="better"||PP.test(nx)?" had":" would");
    else if(/^(due|likely|unlikely|about|expected|said|believed|thought|going|on)$/.test(nx))t[i]=m[1]+" is";
    else if(["it","that","there","what","who","he","she","where","here"].includes(m[1]))t[i]=m[1]+(/^(been|got|gone|had|come|never)$/.test(nx)?" has":" is");
  }
  return t.join(" ").replace(/'/g,"").replace(/\s/g,"");
}
function patRe(p){
  p=baseClean(p.replace(/[{}\[\]|]/g,c=>({"{":"\u0001","}":"\u0002","[":"\u0003","]":"\u0004","|":"\u0005"}[c]))).replace(/'/g,"").replace(/\s/g,"");
  let r="";for(const c of p){r+=c==="\u0001"?"(?:":c==="\u0002"?")":c==="\u0003"?"(?:":c==="\u0004"?")?":c==="\u0005"?"|":c.replace(/[.*+?^$()\\\/]/g,"\\$&");}
  return new RegExp("^"+r+"$");
}
function matches(input,patterns){const v=normInput(input);if(!v)return null;return patterns.some(p=>patRe(p).test(v));}

  const nav=$("div",{class:"foot"});
  nav.append(idx>0?$("button",{class:"btn",onclick:()=>show(idx-1)},"← "+SECTIONS[idx-1].title):$("span"));
  if(idx<SECTIONS.length-1)nav.append($("button",{class:"btn solid",onclick:()=>show(idx+1)},SECTIONS[idx+1].title+" →"));
  p.append(nav);p.hidden=true;panels.append(p);pans.push(p);
});
function show(i){tbtn.forEach((b,k)=>b.setAttribute("aria-selected",k===i?"true":"false"));pans.forEach((p,k)=>p.hidden=k!==i);tbtn[i].scrollIntoView({block:"nearest",inline:"nearest"});window.scrollTo({top:0});try{localStorage.setItem("vit-1211-tab",i)}catch(e){}}
let start=0;try{const v=+localStorage.getItem("vit-1211-tab");if(v>=0&&v<SECTIONS.length)start=v;}catch(e){}
const hi=SECTIONS.findIndex(s=>s.id===location.hash.slice(1));if(hi>=0)start=hi;
show(start);
</script>
