<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitaliy: exam prep, vocabulary and grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF2; --paper:#FFFFFF; --ink:#1D2230; --muted:#5E6677; --line:#D6DAE1;
  --v:#0E6B5C; --v-soft:#E0EFEB; --g:#3A4AA6; --g-soft:#E6E9F7;
  --ok:#1F8A4C; --ok-soft:#E2F3E8; --bad:#B3261E; --bad-soft:#FBE8E6; --key:#FFF0B3;
}
body[data-block="v"]{--acc:var(--v);--acc-soft:var(--v-soft)}
body[data-block="g"]{--acc:var(--g);--acc-soft:var(--g-soft)}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.top{max-width:1000px;margin:0 auto;padding:28px 20px 14px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.top h1{font-family:'Literata',Georgia,serif;font-weight:600;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.12;margin:0}
.top p{margin:6px 0 0;color:var(--muted)}
.blocks{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.blocks button{border:0;background:none;padding:8px 18px;border-radius:10px;text-align:left;font-weight:600;color:var(--muted)}
.blocks button small{display:block;font-weight:400;font-size:.78rem}
.blocks button[aria-pressed="true"]{background:var(--acc);color:#fff}

.tabs{max-width:1000px;margin:0 auto;padding:4px 20px 2px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px 6px 6px;font-size:.92rem}
.tab .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:.8rem;font-weight:700;margin-right:8px}
.tab[aria-selected="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:600}

.ex{max-width:1000px;margin:14px auto 48px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 30px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ex-head h2{font-family:'Literata',Georgia,serif;font-weight:600;font-size:1.65rem;margin:0}
.time{color:var(--muted);font-size:.9rem;white-space:nowrap}
.instr{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:12px}
.instr p{margin:0;flex:1}
.rus{flex:none;font-size:.72rem;font-weight:700;border:1px solid var(--muted);border-radius:6px;background:var(--paper);padding:2px 8px;color:var(--muted)}

.parts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:18px 0 0}
.part{min-width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.9rem;padding:0 8px}
.part.done{border-color:var(--acc);color:var(--acc)}
.part[aria-current="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.set-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:14px}
.set-title{font-family:'Literata',Georgia,serif;font-size:1.25rem;font-weight:600;margin:0}
.score{font-size:.9rem;color:var(--muted)}
.score b{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0 0 0 10px}

.box{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border:1.5px dashed var(--acc);border-radius:12px;margin:12px 0 4px}
.chip{font-size:.9rem;padding:2px 10px;background:var(--acc-soft);border-radius:999px}

ol.items{list-style:none;counter-reset:q;padding:0;margin:8px 0 0}
ol.items li{counter-increment:q;display:grid;grid-template-columns:2.1em 1fr auto;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
ol.items li:first-child{border-top:0}
ol.items li::before{content:counter(q);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:5px;font-size:.9rem}
.txt{font-family:'Literata',Georgia,serif;font-size:1.06rem;line-height:1.75}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:96px;padding-top:2px}
.reveal{grid-column:2 / -1;font-size:.93rem}
.reveal:empty{display:none}

select,input[type="text"]{font-family:'Onest',system-ui,sans-serif;font-size:.95rem;color:var(--ink);border:0;border-bottom:2px solid var(--acc);background:var(--acc-soft);padding:2px 6px;border-radius:5px 5px 0 0;max-width:100%}
select{padding-right:2px}
textarea{display:block;width:100%;font-family:'Onest',system-ui,sans-serif;font-size:.95rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;resize:vertical}
.ok{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.key{background:var(--key);padding:1px 7px;border-radius:5px;font-family:'Onest',system-ui,sans-serif;font-size:.9rem;line-height:1.5;display:inline-block}
.tick{color:var(--ok);font-weight:700}
.cross{color:var(--bad);font-weight:700}
.ans{font-size:.84rem;font-weight:600;border:1px solid var(--acc);color:var(--acc);background:var(--paper);border-radius:8px;padding:4px 12px}
.ans:hover{background:var(--acc-soft)}
.opts{display:block;font-family:'Onest',system-ui,sans-serif}
.opt{font-size:.92rem;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 12px;margin:6px 6px 0 0}
.opt.chosen{border-color:var(--acc);background:var(--acc-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.blank{display:inline-block;width:3.6em;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:-3px}
.def{color:var(--ink)}
.orig{display:block}
.kw{display:inline-block;font-family:'Onest',system-ui,sans-serif;font-weight:700;letter-spacing:.05em;font-size:.8rem;background:var(--ink);color:#fff;padding:1px 9px;border-radius:5px;margin:6px 0 2px}
.stem{display:block}
.ruq{display:block}
.note{color:var(--muted)}
.fixrow{display:block;margin-top:8px;font-family:'Onest',system-ui,sans-serif;font-size:.95rem;color:var(--muted)}
.jumble{display:block;font-style:italic;color:var(--muted)}
input.wide{width:100%;margin-top:8px;font-family:'Onest',system-ui,sans-serif}
.why{display:block;margin-top:6px;padding:6px 10px;border-left:3px solid var(--bad);background:#FAFAFB;border-radius:0 6px 6px 0;line-height:1.5}
.reveal .key + .why{margin-top:6px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.nav button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 16px;font-weight:600}
.nav button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.nav button[disabled]{opacity:.35;cursor:default}

@media (max-width:640px){
  .top{padding:20px 14px 10px}
  .tabs{padding:4px 14px 2px}
  .ex{padding:18px 16px;border-radius:14px;margin:10px 8px 40px}
  ol.items li{grid-template-columns:1.8em 1fr}
  .side{grid-column:2;flex-direction:row-reverse;justify-content:flex-end;align-items:center;min-width:0}
}
@media (prefers-reduced-motion:no-preference){.opt,.ans,.part,.tab{transition:background-color .12s,border-color .12s}}
</style>
</head>

<header class="top">
  <div>

<main id="panel"></main>

<script id="data">
const DATA = [

/* ===================== VOCABULARY ===================== */

{block:`v`, id:`v1`, type:`gap`, mode:`select`, min:6, title:`Comment adverbs`,
 en:`Complete each sentence with the adverb or phrase that matches the meaning in brackets.`,
 sets:[{t:``, items:`
___, he's still at work: his car isn't in the drive. (= I assume this, judging by the evidence) | presumably | Presumably — надо полагать. Вывод по косвенным признакам.
___, the new manager starts next week. At least that's what I heard. (= I've heard this, but I can't confirm it) | apparently | Apparently — судя по всему, как говорят. Информация с чужих слов.
He ___ hadn't read the report: he knew nothing about it. (= it is obvious from the facts) | evidently | Evidently — очевидно, явно. Вывод из наблюдаемых фактов.
She is ___ the strongest candidate we've seen. (= I am certain and nobody would argue) | no doubt | No doubt — без сомнения.
I expected the film to be dull, but ___ it was excellent. (= in reality, contrary to what you'd expect) | actually | Actually — на самом деле, вопреки ожиданиям. Не путать с «актуально».
"Could you send it today?" "___!" (= yes, of course) | certainly | Certainly — конечно, разумеется. Вежливое согласие в ответ на просьбу.
The food was expensive, and not very good ___. (= and I want to emphasise this) | indeed | Indeed усиливает уже сказанное: и правда, причем.
___, I ran into my old teacher at an airport in Tokyo. (= this is a strange coincidence) | funnily enough | Funnily enough — как ни странно, забавно, что…
___, we can't afford a second car this year. (= speaking in practical terms) | practically speaking | Practically speaking — если говорить практически, по факту.
It's your money and your future: ___, it's your decision. (= when everything is considered) | at the end of the day | At the end of the day — в конечном счете.`}]},

{block:`v`, id:`v2`, type:`tf`, tfT:`Positive`, tfF:`Negative`, min:5, title:`Positive or negative?`,
 en:`Does the word carry a positive or a negative meaning?`,
 sets:[{t:``, items:`
captivating | T | Captivating — захватывающий, покоряющий. Явно положительное слово.
mundane | F | Mundane — обыденный, скучный. Оттенок отрицательный.
superb | T | Superb — превосходный.
blatant | F | Blatant — наглый, неприкрытый. Используется о лжи, нарушении, обмане.
rewarding | T | Rewarding — приносящий удовлетворение.
draining | F | Draining — выматывающий, высасывающий силы.
invaluable | T | Invaluable — бесценный. Приставка in- здесь не делает слово отрицательным.
misleading | F | Misleading — вводящий в заблуждение.
thorough | T | Thorough — тщательный, доскональный. Это похвала.
cumbersome | F | Cumbersome — громоздкий, неудобный.
grounded | T | Grounded — уравновешенный, твердо стоящий на земле.
high-and-mighty | F | High-and-mighty — высокомерный, надменный.
adept | T | Adept — искусный, умелый.
greedy | F | Greedy — жадный.`}]},

{block:`v`, id:`v3`, type:`mc`, min:6, title:`Which version is right?`,
 en:`Only one of the two sentences is correct. Choose it.`,
 sets:[{t:``, items:`
A lie | *He told a blatant lie. / He made a blatant lie. | Ложь говорят: tell a lie. Make a lie — ошибка.
A soft spot | *She has a soft spot for old films. / She has a soft spot to old films. | Have a soft spot FOR something.
Where an idea comes from | *The project stems from an idea of hers. / The project stems of an idea of hers. | Stem FROM — брать начало в чем-то.
A scam | *Thousands of people fell for the scam. / Thousands of people fell on the scam. | Fall FOR something — попасться на обман.
A disagreement | *They are at odds over the budget. / They are on odds over the budget. | Be AT odds with somebody over something.
Rising costs | *Costs ballooned last year. / Costs ballooned up last year. | Balloon уже означает резкий рост, частица up не нужна.
Staying in touch | *Let's touch base on Monday. / Let's touch the base on Monday. | Touch base — устойчивое выражение без артикля.
Admiration | *She is in awe of his talent. / She is in awe for his talent. | Be in awe OF somebody.
A very high price | *The repairs cost an arm and a leg. / The repairs cost the arm and the leg. | В идиоме используются неопределенные артикли: an arm and a leg.
Interrupting | *I couldn't get a word in edgewise. / I couldn't get a word on edgewise. | Get a word IN edgewise — вставить хоть слово.
A skill | *He is adept at negotiating. / He is adept in negotiate. | Adept AT + герундий.
Being realistic | *She is a very down-to-earth person. / She is a very down-to-the-earth person. | Down-to-earth пишется без артикля внутри.`}]},

{block:`v`, id:`v4`, type:`gap`, mode:`select`, min:6, title:`One verb, three phrases`,
 en:`Choose the verb that fits all three phrases.`,
 sets:[{t:``, items:`
to ___ + a record, the ice, the news to somebody | break | Break a record, break the ice, break the news — побить рекорд, разрядить обстановку, сообщить неприятную новость.
to ___ + a trend, boundaries, an alarm clock | set | Set a trend, set boundaries, set an alarm clock.
to ___ + a promise, somebody posted, an eye on somebody | keep | Keep a promise, keep somebody posted, keep an eye on.
to ___ + attention, a line under something, a conclusion | draw | Draw attention, draw a line under, draw a conclusion.
to ___ + a statement, the headlines, enemies | make | Make a statement, make the headlines, make enemies.
to ___ + a leap of faith, offence, a break | take | Take a leap of faith, take offence, take a break.
to ___ + a cold, on quickly, somebody's eye | catch | Catch a cold, catch on (прижиться), catch somebody's eye.
to ___ + a business, a campaign, out of time | run | Run a business, run a campaign, run out of time.
to ___ + a word in edgewise, over an illness, acquainted | get | Get a word in edgewise, get over an illness, get acquainted.
to ___ + somebody off, the truth, two things apart | tell | Tell somebody off (отругать), tell the truth, tell apart (различать).`}]},

{block:`v`, id:`v5`, type:`mc`, min:6, title:`Which idiom fits?`,
 en:`Read the situation and choose the idiom that fits it.`,
 sets:[{t:``, items:`
Your friend keeps avoiding the main point. | *He's beating around the bush. / He's touching base. / He's keeping you posted. | Beat around the bush — ходить вокруг да около.
Your colleague never listens to any argument. | *It's like talking to a brick wall. / It's a walk in the park. / It's once in a lifetime. | Like talking to a brick wall — как об стенку горох.
You said Tuesday, she heard Thursday. | *We got our wires crossed. / We fell for it. / We caught on. | Get your wires crossed — не понять друг друга.
The task turned out to be extremely easy. | *It was a walk in the park. / It was a hard pill to swallow. / It was smoke and mirrors. | A walk in the park — проще простого.
The company's promises had nothing behind them. | *It was all smoke and mirrors. / It was creature comforts. / It was trials and tribulations. | Smoke and mirrors — пускание пыли в глаза.
Losing the contract was very hard to accept. | *It was a hard pill to swallow. / It was in the blink of an eye. / It was on the house. | A hard pill to swallow — горькая пилюля.
You tried everything and nothing worked. | *We tried, but to no avail. / We tried, for starters. / We tried, at the end of the day. | To no avail — безрезультатно.
The waiter says you don't have to pay for the dessert. | *It's on the house. / It's for starters. / It's at the end of the day. | On the house — за счет заведения.
You want to hear about any changes immediately. | *Keep me posted. / Keep an eye. / Keep in edgewise. | Keep me posted — держи меня в курсе.
Your friend is ready to listen with full attention. | *I'm all ears. / I could eat a horse. / I'm scared stiff. | Be all ears — я весь внимание.`}]},

/* ===================== GRAMMAR ===================== */

{block:`g`, id:`g1`, type:`fix`, mode:`type`, label:`Correct version:`, min:12, title:`Inversion: find the mistake`,
 en:`Each sentence has one mistake in the inverted structure. Type the corrected words only.`,
 sets:[{t:``, items:`
Never I have seen such a storm. | Never have I seen | После never в начале предложения вспомогательный глагол идет перед подлежащим.
No sooner she had arrived than the phone rang. | had she arrived | No sooner … than: инверсия с had.
Rarely he admits a mistake. | does he admit | В Present Simple инверсию образует does: rarely does he admit.
Only after the meeting I realised the truth. | did I realise;did I realize | После only + обстоятельство нужна инверсия с did.
Hardly I had closed the door when the bell rang. | had I closed | Hardly had I closed the door when…
Not only he forgot the tickets, but he also lost his phone. | did he forget | Not only в начале предложения требует инверсии с did.
Under no circumstances you should sign this. | should you sign | Отрицательное обстоятельство в начале: under no circumstances should you sign.
Little he knew what was waiting for him. | did he know | Little did he know — устойчивая конструкция.
Should you will need any help, call me. | Should you need | После should идет голый инфинитив, без will.
Had I would have known, I'd have come. | Had I known | Had I known = if I had known. Would в этой части не ставится.
So loud the music was that we couldn't talk. | was the music | So + прилагательное в начале: so loud was the music.
Not until the next day we understood the problem. | did we understand | Not until + обстоятельство тоже требует инверсии.
Such her anger was that she left the room. | was her anger | Such was her anger that… — эмфатическая конструкция.
Was I you, I'd apologise. | Were I | Were I you — остаток второго типа условных, где всегда were.`}]},

{block:`g`, id:`g2`, type:`mc`, min:12, title:`Participles: choose the form`,
 en:`Choose the correct participle form.`,
 sets:[{t:``, items:`
___ the report, she went straight home. | *Having finished / Having been finished / Finished | Having finished — она сама закончила отчет. Having been finished означало бы, что закончили ее саму.
The man ___ next to me never said a word. | *sitting / sat / having sat | Sitting заменяет who was sitting.
___ in 1890, the house needs major repairs. | *Built / Building / Having built | Дом построили, значит нужно пассивное причастие built.
___ what to say, he said nothing at all. | *Not knowing / Knowing not / Not known | Отрицание ставится перед причастием: not knowing.
___ twice, he finally gave up. | *Having been rejected / Having rejected / Rejecting | Отказали ему, поэтому нужна пассивная форма having been rejected.
We sat on the terrace, ___ the sunset. | *watching / watched / having watched | Одновременное действие передается present participle.
___ untreated, the infection can spread quickly. | *If left / If leaving / Leaving | If left = if it is left. Пассивное причастие после if.
The documents ___ yesterday are on your desk. | *signed / signing / having signed | Документы подписали, значит past participle.
She left the room, ___ the door behind her. | *slamming / slammed / having slammed | Present participle для сопутствующего действия.
___ by the noise, the baby started crying. | *Woken / Waking / Having woken | Ребенка разбудили: пассивное причастие woken.
Weather ___, the match will go ahead. | *permitting / permitted / having permitted | Weather permitting — устойчивый оборот: если погода позволит.
___ all the evidence, the jury reached a verdict. | *Having considered / Considered / Being considered | Присяжные сами изучили доказательства, и это было раньше вердикта.`}]},

{block:`g`, id:`g3`, type:`mc`, min:12, title:`Mixed conditionals: match the facts`,
 en:`Read the two facts and choose the sentence that expresses them correctly.`,
 sets:[{t:``, items:`
I didn't study medicine. I'm not a doctor now. | *If I had studied medicine, I would be a doctor now. / If I studied medicine, I would have been a doctor now. / If I had studied medicine, I would have been a doctor now. | Условие в прошлом, результат в настоящем: had studied + would be.
She is afraid of flying. She didn't come with us to Japan. | *If she weren't afraid of flying, she would have come with us. / If she hadn't been afraid of flying, she would come with us. / If she isn't afraid of flying, she would come with us. | Страх постоянный (настоящее), поездка была в прошлом: weren't + would have come.
We invested in this house ten years ago. We own it now. | *If we hadn't invested then, we wouldn't own the house now. / If we didn't invest then, we wouldn't have owned it now. / If we hadn't invested then, we wouldn't have owned it now. | Вложение в прошлом, владение сейчас.
He is a careless driver. He had an accident last week. | *If he weren't such a careless driver, he wouldn't have had an accident. / If he hadn't been a careless driver, he wouldn't have an accident. / If he isn't a careless driver, he wouldn't have had an accident. | Постоянная черта характера плюс событие в прошлом.
I didn't set the alarm. I'm late now. | *If I had set the alarm, I wouldn't be late now. / If I set the alarm, I wouldn't have been late now. / If I had set the alarm, I wouldn't have been late now. | Действие в прошлом, последствие прямо сейчас.
She doesn't speak German. She didn't get the job in Berlin. | *If she spoke German, she would have got the job. / If she had spoken German, she would get the job. / If she speaks German, she would have got the job. | Умение относится к настоящему, работа была в прошлом.
They missed the flight. They're not on the beach now. | *If they hadn't missed the flight, they would be on the beach now. / If they didn't miss the flight, they would have been on the beach now. / If they hadn't missed the flight, they would have been on the beach now. | Прошлое условие, настоящий результат.
I broke my leg. I'm not running the marathon next week. | *If I hadn't broken my leg, I would be running the marathon next week. / If I didn't break my leg, I would have run the marathon next week. / If I hadn't broken my leg, I would have run the marathon next week. | Условие в прошлом, результат в будущем: would be running.
He isn't organised. He forgot his passport yesterday. | *If he were more organised, he wouldn't have forgotten his passport. / If he had been more organised, he wouldn't forget his passport. / If he is more organised, he wouldn't have forgotten his passport. | Черта характера в настоящем, ошибка в прошлом.
We didn't book early. We're paying double now. | *If we had booked early, we wouldn't be paying double now. / If we booked early, we wouldn't have paid double now. / If we had booked early, we wouldn't have paid double now. | Прошлое условие, результат в настоящем, причем длительный.`}]},

{block:`g`, id:`g4`, type:`gap`, mode:`type`, min:15, title:`Impersonal passive: two ways`,
 en:`Rewrite each sentence in TWO ways. Watch the infinitive: simple, continuous, perfect or passive.`,
 sets:[{t:``, items:`
People say that he owns three restaurants. → It ___ that he owns three restaurants. | is said | Безличная конструкция: после it is said идет that и обычное предложение, без инфинитива.
People say that he owns three restaurants. → He ___ three restaurants. | is said to own | Действие происходит сейчас и одновременно с is said, поэтому простой инфинитив to own.
They believe the thieves escaped through the window. → It ___ that the thieves escaped through the window. | is believed | It is believed that… — время внутри that-придаточного не меняется.
They believe the thieves escaped through the window. → The thieves ___ through the window. | are believed to have escaped | Побег произошел раньше, чем о нем думают, поэтому нужен перфектный инфинитив to have escaped.
Experts think the economy is slowing down. → It ___ that the economy is slowing down. | is thought | It is thought that… — безличный вариант.
Experts think the economy is slowing down. → The economy ___ down. | is thought to be slowing | Действие в процессе прямо сейчас, поэтому длительный инфинитив to be slowing.
They reported that the painting had been stolen. → It ___ that the painting had been stolen. | was reported | Reporting verb в прошедшем, значит was reported.
They reported that the painting had been stolen. → The painting ___. | was reported to have been stolen | Кража была раньше сообщения и носит пассивный характер: to have been + V3.
People expect that the talks will continue. → It ___ that the talks will continue. | is expected | It is expected that + будущее время в придаточном.
People expect that the talks will continue. → The talks ___. | are expected to continue | Будущее действие передается простым инфинитивом to continue, will здесь не нужен.
They alleged that he had taken a bribe. → It ___ that he had taken a bribe. | was alleged | Глагол allege стоял в прошедшем времени.
They alleged that he had taken a bribe. → He ___ a bribe. | was alleged to have taken | Взятка была раньше обвинения, поэтому to have taken.
Everyone knows that she is working on a new novel. → It ___ that she is working on a new novel. | is known | It is known that… — общеизвестно, что…
Everyone knows that she is working on a new novel. → She ___ on a new novel. | is known to be working | Работа идет прямо сейчас: to be working.
People consider him the best surgeon in the country. → He ___ the best surgeon in the country. | is considered to be | Consider somebody to be something в пассиве дает is considered to be.
It is thought that the company lost millions last year. → The company ___ millions last year. | is thought to have lost | Убытки в прошлом, а мнение сейчас, поэтому перфектный инфинитив.`}]},

{block:`g`, id:`g5`, type:`order`, mode:`type`, min:12, title:`Put the words in order`,
 en:`Write the sentence using all the parts given.`,
 sets:[{t:``, items:`
seen / have / such a mess / I / never | Never have I seen such a mess. | Never в начале предложения требует инверсии: have I seen.
the letter, / having / he / read / it / burned | Having read the letter, he burned it. | Перфектное причастие ставится в начало и обозначает более раннее действие.
said / he / is / in Spain / to live | He is said to live in Spain. | Личная конструкция безличного пассива: is said to live.
if / had / earlier, / we / left / we / wouldn't be / in this queue / now | If we had left earlier, we wouldn't be in this queue now. | Смешанный тип: had left в условии, wouldn't be в результате.
the door / no sooner / than / had / closed / she / the phone rang | No sooner had she closed the door than the phone rang. | No sooner … than с инверсией в первой части.
to have been / the painting / is / in 1990 / believed / stolen | The painting is believed to have been stolen in 1990. | Пассивный перфектный инфинитив после is believed.
untreated, / if / the infection / left / can / spread | If left untreated, the infection can spread. | После if подлежащее и be опускаются.
were / if / more patient, / I / I / at her / yesterday / wouldn't have shouted | If I were more patient, I wouldn't have shouted at her yesterday. | Свойство характера в настоящем, поступок в прошлом.
it / that / is / the talks / will continue / expected | It is expected that the talks will continue. | Безличная конструкция с that, без инфинитива.
known, / had / I / I'd / come / have | Had I known, I'd have come. | Инверсия вместо if в третьем типе условных.`}]}
];

</script>

<script>
const tabsEl = document.getElementById('tabs');
const panel = document.getElementById('panel');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const alts = a => a.split(';').map(x => x.trim()).filter(Boolean);
const norm = s => String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').replace(/[.!?,\s]+$/, '').trim();
const loose = s => norm(s).replace(/[.,!?;:"]/g, '').replace(/\s+/g, ' ').trim();
const sortKey = s => s.toLowerCase().replace(/^(a|an|the|to)\s+/, '');

DATA.forEach(ex => ex.sets.forEach(s => {
  s.p = s.items.trim().split('\n').map(l => l.trim()).filter(Boolean).map(l => l.split(/\s+\|\s+/));
  if (ex.mode === 'select') {
    const seen = new Set(); s.bank = [];
    s.p.forEach(it => { const w = alts(it[1])[0]; if (!seen.has(w)) { seen.add(w); s.bank.push(w); } });
    s.bank.sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  }
}));

const cur = { block: 'v', ex: 0, set: 0 };
const state = {};
const exOf = b => DATA.filter(e => e.block === b);
const byId = Object.fromEntries(DATA.map(e => [e.id, e]));
const fmtMin = m => m >= 60 ? `about ${Math.floor(m / 60)} h ${m % 60 ? (m % 60) + ' min' : ''}`.trim() : `about ${m} min`;
document.getElementById('tv').textContent = fmtMin(exOf('v').reduce((a, e) => a + e.min, 0));
document.getElementById('tg').textContent = fmtMin(exOf('g').reduce((a, e) => a + e.min, 0));

function control(ex, s, it, k) {
  if (ex.mode === 'select') {
    return `<select data-k="${k}" aria-label="Answer"><option value="">choose…</option>${s.bank.map(w => `<option>${esc(w)}</option>`).join('')}</select>`;
  }
  const ans = ex.type === 'kw' ? it[3] : it[1];
  const len = Math.max(...alts(ans).map(a => a.length));
  return `<input type="text" data-k="${k}" aria-label="Answer" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(6, len + 3)}ch">`;
}
const fill = (t, ctrl) => t.split('___').map(esc).join(ctrl);

function itemHTML(ex, s, it, k) {
  let body = '';
  switch (ex.type) {
    case 'def': body = `<span class="txt">${control(ex, s, it, k)} <span class="def">${esc(it[0])}</span></span>`; break;
    case 'gap': body = `<span class="txt">${fill(it[0], control(ex, s, it, k))}</span>`; break;
    case 'mc': {
      const opts = it[1].split(' / ');
      body = `<span class="txt">${fill(it[0], '<span class="blank"></span>')}<span class="opts">${opts.map((o, i) => `<button class="opt" data-k="${k}" data-i="${i}">${esc(o.replace(/^\*/, ''))}</button>`).join('')}</span></span>`;
      break;
    }
    case 'tf': body = `<span class="txt">${esc(it[0])}<span class="opts"><button class="opt" data-k="${k}" data-i="T">${esc(ex.tfT || 'Correct')}</button><button class="opt" data-k="${k}" data-i="F">${esc(ex.tfF || 'Incorrect')}</button></span></span>`; break;
    case 'kw': body = `<span class="txt"><span class="orig">${esc(it[0])}</span><span class="kw">${esc(it[1])}</span><span class="stem">${fill(it[2], control(ex, s, it, k))}</span></span>`; break;
    case 'tr': body = `<span class="txt"><span class="ruq">${esc(it[0])}</span><textarea data-k="${k}" rows="2" placeholder="Your translation"></textarea></span>`; break;
    case 'fix': body = `<span class="txt">${esc(it[0])}<span class="fixrow">${esc(ex.label || 'Correct version:')} ${control(ex, s, it, k)}</span></span>`; break;
    case 'order': body = `<span class="txt"><span class="jumble">${esc(it[0])}</span><input type="text" class="wide" data-k="${k}" aria-label="Answer" autocomplete="off" autocapitalize="off" spellcheck="false"></span>`; break;
  }
  return `<li data-k="${k}">${body}<span class="side"><button class="ans" data-k="${k}">Answer</button><span class="res" aria-live="polite"></span></span><div class="reveal" aria-live="polite"></div></li>`;
}

function render() {
  document.body.dataset.block = cur.block;
  document.querySelectorAll('.blocks button').forEach(b => b.setAttribute('aria-pressed', b.dataset.block === cur.block));
  const list = exOf(cur.block);
  tabsEl.innerHTML = list.map((e, i) => `<button class="tab" role="tab" aria-selected="${i === cur.ex}" data-i="${i}"><span class="n">${i + 1}</span>${esc(e.title)}</button>`).join('');
  const ex = list[cur.ex], s = ex.sets[cur.set], si = cur.set;
  const keys = s.p.map((_, i) => `${ex.id}-${si}-${i}`);
  const isLastSet = si === ex.sets.length - 1, isLastEx = cur.ex === list.length - 1;
  panel.innerHTML = `
  <section class="ex">
    <div class="ex-head"><h2>${esc(ex.title)}</h2><span class="time">${fmtMin(ex.min)}</span></div>
    <div class="instr"><p class="en">${esc(ex.en)}</p></div>
    ${ex.sets.length > 1 ? `<div class="parts" aria-label="Parts">${ex.sets.map((x, i) => `<button class="part${setDone(ex, i) ? ' done' : ''}" data-i="${i}" aria-current="${i === si}" title="${esc(x.t)}">${i + 1}</button>`).join('')}</div>` : ''}
    <div class="set-row">${s.t ? `<h3 class="set-title">${esc(s.t)}</h3>` : '<span></span>'}<span class="score" id="score"></span></div>
    ${s.bank ? `<div class="box">${s.bank.map(w => `<span class="chip">${esc(w)}</span>`).join('')}</div>` : ''}
    <ol class="items">${s.p.map((it, i) => itemHTML(ex, s, it, keys[i])).join('')}</ol>
    <div class="nav">
      <button class="prev" ${si === 0 && cur.ex === 0 ? 'disabled' : ''}>Back</button>
      <button class="next primary" ${isLastSet && isLastEx ? 'disabled' : ''}>${isLastSet ? 'Next exercise' : 'Next part'}</button>
    </div>
  </section>`;
  keys.forEach(k => {
    const st = state[k]; if (!st) return;
    const el = panel.querySelector(`[data-k="${k}"]:is(select,input,textarea)`);
    if (el && st.v !== undefined) el.value = st.v;
    if (st.v !== undefined) panel.querySelectorAll(`.opt[data-k="${k}"]`).forEach(b => b.classList.toggle('chosen', b.dataset.i === String(st.v)));
    if (st.done) check(k);
  });
  updateScore();
}

function setDone(ex, si) {
  return ex.sets[si].p.every((_, i) => state[`${ex.id}-${si}-${i}`]?.done);
}

function check(k) {
  const [id, si, ii] = k.split('-');
  const ex = byId[id], it = ex.sets[+si].p[+ii];
  const li = panel.querySelector(`li[data-k="${k}"]`); if (!li) return;
  const st = state[k] || (state[k] = {}); st.done = true;
  const res = li.querySelector('.res'), rev = li.querySelector('.reveal');
  let ok = null;
  const why = ex.type === 'kw' ? it[4] : it[2];
  const whyHTML = why ? `<span class="why">${esc(why)}</span>` : '';
  if (ex.type === 'def' || ex.type === 'gap' || ex.type === 'kw' || ex.type === 'fix' || ex.type === 'order') {
    const ans = alts(ex.type === 'kw' ? it[3] : it[1]);
    const cmp = ex.type === 'order' ? loose : norm;
    ok = ans.some(a => cmp(a) === cmp(st.v));
    const inp = li.querySelector('select,input');
    inp.classList.toggle('ok', ok); inp.classList.toggle('bad', !ok);
    res.innerHTML = ok ? '<span class="tick">✓</span>' : '<span class="cross">✗</span>';
    rev.innerHTML = ok ? (ans.length > 1 ? `<span class="key">${esc(ans.join('  /  '))}</span>` : '') : `<span class="key">${esc(ans.join('  /  '))}</span>${whyHTML}`;
  } else if (ex.type === 'mc') {
    const opts = it[1].split(' / '), right = opts.findIndex(o => o.startsWith('*'));
    const chosen = st.v === undefined ? -1 : +st.v;
    ok = chosen === right;
    li.querySelectorAll('.opt').forEach(b => {
      const i = +b.dataset.i;
      b.classList.toggle('right', i === right);
      b.classList.toggle('wrong', i === chosen && !ok);
    });
    res.innerHTML = ok ? '<span class="tick">✓</span>' : '<span class="cross">✗</span>';
    rev.innerHTML = ok ? '' : whyHTML;
  } else if (ex.type === 'tf') {
    const right = it[1];
    ok = st.v === right;
    li.querySelectorAll('.opt').forEach(b => {
      b.classList.toggle('right', b.dataset.i === right);
      b.classList.toggle('wrong', b.dataset.i === st.v && !ok);
    });
    res.innerHTML = ok ? '<span class="tick">✓</span>' : '<span class="cross">✗</span>';
    rev.innerHTML = ok ? '' : whyHTML;
  } else if (ex.type === 'tr') {
    rev.innerHTML = `<span class="key">${esc(it[1])}</span>${whyHTML}`;
  }
  st.ok = ok;
}

function updateScore() {
  const list = exOf(cur.block), ex = list[cur.ex], si = cur.set, s = ex.sets[si];
  const el = document.getElementById('score'); if (!el) return;
  if (ex.type === 'tr') { el.innerHTML = ''; return; }
  let c = 0, d = 0;
  s.p.forEach((_, i) => { const st = state[`${ex.id}-${si}-${i}`]; if (st?.done) { d++; if (st.ok) c++; } });
  el.innerHTML = `Correct: <b>${c}</b> of ${s.p.length}${d ? `<button class="linkbtn" id="reset">Start this part again</button>` : ''}`;
  const part = panel.querySelector(`.part[data-i="${si}"]`);
  if (part) part.classList.toggle('done', setDone(ex, si));
}

function go(dir) {
  const list = exOf(cur.block), ex = list[cur.ex];
  if (dir > 0) {
    if (cur.set < ex.sets.length - 1) cur.set++;
    else if (cur.ex < list.length - 1) { cur.ex++; cur.set = 0; }
  } else {
    if (cur.set > 0) cur.set--;
    else if (cur.ex > 0) { cur.ex--; cur.set = list[cur.ex].sets.length - 1; }
  }
  render(); window.scrollTo({ top: 0 });
}

document.querySelector('.blocks').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.block === cur.block) return;
  cur.block = b.dataset.block; cur.ex = 0; cur.set = 0; render();
});
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  cur.ex = +b.dataset.i; cur.set = 0; render();
});
panel.addEventListener('click', e => {
  const t = e.target;
  const part = t.closest('.part'); if (part) { cur.set = +part.dataset.i; render(); return; }
  if (t.closest('.next')) return go(1);
  if (t.closest('.prev')) return go(-1);
  if (t.id === 'reset') {
    const ex = exOf(cur.block)[cur.ex];
    ex.sets[cur.set].p.forEach((_, i) => delete state[`${ex.id}-${cur.set}-${i}`]);
    render(); return;
  }
  const opt = t.closest('.opt');
  if (opt) {
    const k = opt.dataset.k, st = state[k] || (state[k] = {});
    st.v = opt.dataset.i;
    panel.querySelectorAll(`.opt[data-k="${k}"]`).forEach(b => b.classList.toggle('chosen', b === opt));
    if (st.done) { check(k); updateScore(); }
    return;
  }
  const ans = t.closest('.ans');
  if (ans) { check(ans.dataset.k); updateScore(); }
});
const onInput = e => {
  const k = e.target.dataset.k; if (!k) return;
  (state[k] || (state[k] = {})).v = e.target.value;
};
panel.addEventListener('input', onInput);
panel.addEventListener('change', onInput);
panel.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[data-k]')) { e.preventDefault(); check(e.target.dataset.k); updateScore(); }
});

render();
</script>
</body>
</html>
