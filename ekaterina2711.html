<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grammar Practice 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --accent:#4f46e5; --accent-soft:#eef2ff; --ok:#15803d; --ok-soft:#dcfce7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --info:#92400e; --info-soft:#fef3c7;
  --field:#ffffff; --field-line:#cbd5e1; --soft:#f3f4f6; --ok-line:#86efac; --info-line:#fcd34d; --ru:#374151;
  --tile:#eef2ff; --tile-ink:#3730a3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#12131a; --card:#1c1e28; --ink:#e7e8ee; --muted:#9ca0b0; --line:#2d3040;
  --accent:#8b85ff; --accent-soft:#2a2850; --ok:#6ee7a0; --ok-soft:#133524;
  --bad:#fca5a5; --bad-soft:#3d1a1d; --info:#fcd34d; --info-soft:#3a2f12;
  --field:#14151d; --field-line:#3a3d50; --soft:#262836; --ok-line:#2f7a4f; --info-line:#8a6a17; --ru:#d4d6df;
  --tile:#2a2850; --tile-ink:#c7c4ff;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#12131a; --card:#1c1e28; --ink:#e7e8ee; --muted:#9ca0b0; --line:#2d3040;
  --accent:#8b85ff; --accent-soft:#2a2850; --ok:#6ee7a0; --ok-soft:#133524;
  --bad:#fca5a5; --bad-soft:#3d1a1d; --info:#fcd34d; --info-soft:#3a2f12;
  --field:#14151d; --field-line:#3a3d50; --soft:#262836; --ok-line:#2f7a4f; --info-line:#8a6a17; --ru:#d4d6df;
  --tile:#2a2850; --tile-ink:#c7c4ff;}
*{box-sizing:border-box}
[hidden]:not([hidden=until-found i]){display:none!important}
body{margin:0;padding:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:22px 0 18px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header h1{margin:0;font-size:1.6rem;text-wrap:balance}
header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
.score{margin-top:10px;display:inline-block;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-weight:600;font-size:.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 .9rem Inter,sans-serif;cursor:pointer;white-space:nowrap}
nav button.active{background:#4f46e5;border-color:#4f46e5;color:#fff}
nav button .mini{font-size:.75rem;opacity:.8;margin-left:4px}
main{padding:20px 0 60px}
.page{display:none}.page.active{display:block}
.intro{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:16px;border-left:5px solid var(--accent)}
.intro h2{margin:0 0 4px;font-size:1.25rem}
.intro p{margin:0;color:var(--muted)}
.item{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.item.solved{border-color:var(--ok-line)}
.item.revealed{border-color:var(--info-line)}
.q{font-weight:500}
.q .n{display:inline-block;min-width:26px;color:var(--accent);font-weight:700}
.sit{color:var(--muted);font-style:italic;margin:4px 0 6px 26px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-left:26px}
input[type=text],select{font:inherit;padding:7px 10px;border:1px solid var(--field-line);border-radius:8px;background:var(--field);color:var(--ink)}
input[type=text]{min-width:240px}
input.wide{flex:1;min-width:260px}
input[type=text]:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input.okc{border-color:var(--ok);background:var(--ok-soft)}
input.badc{border-color:var(--bad);background:var(--bad-soft)}
input.infoc{border-color:var(--info-line);background:var(--info-soft)}
.btn{border:none;border-radius:8px;padding:7px 14px;font:600 .85rem Inter,sans-serif;cursor:pointer}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.check{background:#4f46e5;color:#fff}
.btn.ans{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:3px 9px;font-size:.75rem;background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.btn.reset,.btn.copy{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.copied{color:var(--ok);font-size:.85rem;align-self:center}
/* options & multi-select */
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-left:26px}
.opt{text-align:left;border:1px solid var(--field-line);background:var(--field);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--accent)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opt.right,.opt.sel.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong,.opt.sel.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.need{display:inline-block;margin-left:6px;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;vertical-align:middle}
/* builder */
.built{min-height:44px;border:2px dashed var(--field-line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 26px;align-items:center}
.built:empty::before{content:"Click the words below in the right order";color:var(--muted);font-size:.85rem;padding-left:4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 26px}
.tile{border:1px solid var(--accent);background:var(--tile);color:var(--tile-ink);border-radius:8px;padding:5px 10px;font:500 .95rem Inter,sans-serif;cursor:pointer}
.tile.used{visibility:hidden}
/* rewrite */
.rubr{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.82rem;border-radius:6px;padding:2px 8px;margin-left:6px;letter-spacing:.02em}
.rw-line{margin:10px 0 0 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;line-height:1.8}
.rw-line input{min-width:220px;flex:1;max-width:420px}
/* story inline choice */
.text{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--line);line-height:2.4;margin-bottom:14px}
.text h3{margin:0 0 8px;line-height:1.4;font-size:1.1rem}
.pair{white-space:nowrap}
.pair .gn{font-size:.75rem;color:var(--accent);font-weight:700;margin-right:3px}
.choice{font:inherit;font-size:.95rem;border:1px solid var(--field-line);background:var(--field);color:var(--ink);border-radius:6px;padding:1px 8px;line-height:1.4;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.slash{color:var(--muted);margin:0 3px}
.pair .q-ans{margin-left:4px;padding:0 7px;line-height:1.4}
/* error hunt */
.hunt h3{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hunt .body{line-height:2.1;font-size:1rem}
.hunt .w{cursor:pointer;border-radius:4px;padding:1px 2px}
.hunt .w:hover{background:var(--accent-soft)}
.hunt .w.miss{background:var(--bad-soft);color:var(--bad)}
.hunt .w.hit{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;cursor:default}
.hunt .w.shown{background:var(--info-soft);color:var(--info);text-decoration:line-through;cursor:default}
.hunt .corr{color:var(--ok);font-weight:700;margin-left:4px}
.hunt .cnt{font-weight:600;color:var(--accent);font-size:.88rem;background:var(--accent-soft);padding:2px 10px;border-radius:999px}
/* feedback */
.fb{display:none;margin:10px 0 0 26px;padding:9px 12px;border-radius:8px;font-size:.92rem}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.fb.info{display:block;background:var(--info-soft);color:var(--info)}
.fb .en{display:block;margin-top:3px;color:var(--ink);font-weight:400}
.fb .ru{display:block;margin-top:4px;color:var(--ru);font-weight:400}
.fb .fbtools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 0}
/* translation */
.tr .ru-src{font-weight:500}
.tr .en-out{display:none;margin:8px 0 0 26px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-weight:500}
.tr .en-out.show{display:block}
@media (max-width:600px){
  input[type=text],input.wide,.rw-line input{min-width:0;width:100%;max-width:none}
  .row,.opts,.bank,.rw-line{padding-left:0;margin-left:0}
  .built,.fb,.sit,.tr .en-out{margin-left:0}
  .pair{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ================= DATA ================= */
const EX = [
/* 1. SENTENCE BUILDER */
{
 id:"build", title:"1. Sentence Builder", type:"builder",
 intro:"Click the words in the right order to build a grammatically correct sentence. Click any word in the dashed box to remove it.",
 items:[
  {cue:"First she locked the bakery, then she walked home.",
   chunks:["Having","locked","the bakery,","she","walked","home."],
   en:"Perfect participle (active): Having + V3 shows an action completed before the main verb.", ru:"Перфектное причастие (актив): Having + V3 показывает действие, которое завершилось раньше главного."},
  {cue:"You want your friend to close the curtains politely.",
   chunks:["Would","you","mind","closing","the","curtains?"],
   en:"Polite request: Would you mind + V-ing (no ‘to’).", ru:"Вежливая просьба: Would you mind + V-ing (без to)."},
  {cue:"People believe the stone bridge was built in 1720.",
   chunks:["The stone","bridge","is believed","to have been","built","in 1720."],
   en:"Personal passive about a past event: is believed + to have been + V3.", ru:"Личный пассив о событии в прошлом: is believed + to have been + V3."},
  {cue:"It's late and you think your brother should buy a new coat now.",
   chunks:["It's","high time","you","bought","a new","coat."],
   en:"It's high time + subject + Past Simple.", ru:"It's high time + подлежащее + Past Simple."},
  {cue:"You regret not taking a map on yesterday's hike.",
   chunks:["If only","we","had","taken","a map","yesterday!"],
   en:"Regret about the past: If only + Past Perfect.", ru:"Сожаление о прошлом: If only + Past Perfect."},
  {cue:"Official announcement: the new ferry terminal opens next Monday.",
   chunks:["The new","ferry terminal","is","to open","next","Monday."],
   en:"be to + V1 expresses an official scheduled plan.", ru:"be to + V1 выражает официальный запланированный срок."},
  {cue:"He stayed up late last night, so he feels sleepy now.",
   chunks:["If he","hadn't","stayed up","late,","he wouldn't","be sleepy now."],
   en:"Mixed conditional: unreal past (hadn't stayed up) → unreal present result (wouldn't be).", ru:"Смешанное условное: нереальное прошлое (hadn't stayed up) → результат сейчас (wouldn't be)."},
  {cue:"The hikers were almost ready to turn back because of the fog.",
   chunks:["The hikers","were","on the verge","of","turning","back."],
   en:"be on the verge of + V-ing = very close to doing something.", ru:"be on the verge of + V-ing — быть на грани какого-то действия."},
  {cue:"She started painting the hallway at nine and is still painting.",
   chunks:["She","has been","painting","the hallway","since","nine."],
   en:"Action started in the past and still in progress: Present Perfect Continuous + since.", ru:"Действие началось в прошлом и продолжается: Present Perfect Continuous + since."},
  {cue:"The letter was written in pencil, so it was hard to read.",
   chunks:["Written","in pencil,","the letter","was","hard","to read."],
   en:"Past participle clause (passive): Written = Because it was written.", ru:"Пассивный причастный оборот (Причастие II): Written = написанное карандашом."},
  {cue:"Ask if she will manage to join the picnic on Sunday.",
   chunks:["Will","you","be able","to join","us","on Sunday?"],
   en:"Future ability uses will + subject + be able to + V1.", ru:"Способность/возможность в будущем: will + подлежащее + be able to + V1."},
  {cue:"They went cycling even though the wind was freezing.",
   chunks:["Despite","the freezing","wind,","they","went","cycling."],
   alt:["They went cycling despite the freezing wind."],
   en:"Despite + noun phrase (no ‘of’, no verb in the despite phrase).", ru:"Despite + существительное (без предлога of и без глагола)."}
 ]
},

/* 2. KEY WORD REWRITE */
{
 id:"rewrite", title:"2. Key Word Rewrite", type:"rewrite",
 intro:"Complete the second sentence using the word in purple so that it means the same as the first one. Type ONLY the missing part.",
 items:[
  {orig:"You really ought to repair that leaking roof now.", key:"HIGH TIME", pre:"It's ", post:" that leaking roof.",
   a:["high time you repaired"],
   en:"It's high time + subject + Past Simple.", ru:"It's high time + подлежащее + Past Simple."},
  {orig:"People say that the chef won three awards in Paris.", key:"SAID", pre:"The chef ", post:" three awards in Paris.",
   a:["is said to have won"],
   en:"Personal passive about a past achievement: is said + to have + V3.", ru:"Личный пассив о прошлом событии: is said + to have + V3."},
  {orig:"I regret selling my grandfather's old bicycle.", key:"IF ONLY", pre:"", post:" my grandfather's old bicycle!",
   a:["If only I hadn't sold","If only I had not sold"],
   en:"Past regret: If only + Past Perfect.", ru:"Сожаление о прошлом: If only + Past Perfect."},
  {orig:"Could you please turn down the radio?", key:"MIND", pre:"Would you ", post:" the radio?",
   a:["mind turning down"],
   en:"Would you mind + V-ing.", ru:"Would you mind + V-ing."},
  {orig:"The old cinema was just about to close when a local family bought it.", key:"VERGE", pre:"The old cinema was ", post:" when a local family bought it.",
   a:["on the verge of closing","on the verge of closing down"],
   en:"be on the verge of + V-ing.", ru:"be on the verge of + V-ing."},
  {orig:"Because he didn't know the local dialect, he got lost in the market.", key:"NOT", pre:"", post:" the local dialect, he got lost in the market.",
   a:["Not knowing"],
   en:"Negative participle clause of reason: Not + V-ing.", ru:"Отрицательный причастный оборот причины: Not + V-ing."},
  {orig:"She didn't bring a raincoat, so she is shivering right now.", key:"WOULD", pre:"If she had brought a raincoat, she ", post:" right now.",
   a:["wouldn't be shivering","would not be shivering"],
   en:"Mixed conditional: past condition (had brought) → present continuous result (wouldn't be shivering).", ru:"Смешанное условное: условие в прошлом → результат прямо сейчас (wouldn't be shivering)."},
  {orig:"The mayor's official plan is to open the new park on Saturday.", key:"IS TO", pre:"The new park ", post:" by the mayor on Saturday.",
   a:["is to be opened"],
   en:"Official plan in the passive: is to + be + V3.", ru:"Официальный план в пассиве: is to + be + V3."},
  {orig:"I started learning Italian in 2022 and I'm still learning it.", key:"BEEN", pre:"I ", post:" since 2022.",
   a:["have been learning Italian","'ve been learning Italian"],
   en:"Action from 2022 up to now → Present Perfect Continuous.", ru:"Действие с 2022 года до сих пор → Present Perfect Continuous."},
  {orig:"Tom didn't manage to unlock the rusty garden gate.", key:"ABLE", pre:"Tom ", post:" the rusty garden gate.",
   a:["wasn't able to unlock","was not able to unlock"],
   en:"Past inability on a specific occasion: wasn't able to + V1.", ru:"Отсутствие возможности в конкретной ситуации в прошлом: wasn't able to + V1."},
  {orig:"After finishing all the errands, Nora sat down with a cup of tea.", key:"HAVING", pre:"", post:" all the errands, Nora sat down with a cup of tea.",
   a:["Having finished"],
   en:"Perfect participle (active): Having + V3.", ru:"Перфектное причастие (актив): Having + V3."},
  {orig:"You had the chance to call me for a lift yesterday, why didn't you?", key:"COULD", pre:"You ", post:" for a lift yesterday!",
   a:["could have called me"],
   en:"Unused past opportunity: could have + V3.", ru:"Упущенная возможность в прошлом: could have + V3."}
 ]
},

/* 3. STORY: INLINE CHOICE */
{
 id:"story", title:"3. Story: Inline Choice", type:"storychoice",
 intro:"Read the two short stories and click the correct option at each numbered point. The explanation appears in the box below.",
 stories:[
  {title:"Story A: The Weekend Cottage",
   text:"{0} early on Saturday morning, we drove out to my uncle's old cottage by the lake. The house, {1} in 1928, is believed {2} by a retired shipbuilder. By the time we arrived, rain {3} for hours, so the garden path was completely muddy. {4} the heavy drizzle, we unloaded our bags and lit the stove. \"It's high time we {5} these wooden shutters,\" my uncle laughed, pointing at the peeling paint. \"If I {6} so busy this spring, I would have painted them back in May.\" Just as we were on the verge of {7} up on our walk, the clouds broke and sunlight flooded the valley."},
  {title:"Story B: The Harbor Ferry",
   text:"According to the harbor notice board, the new electric ferry {8} its first trip next Tuesday morning. Yesterday, however, {9} along the pier, I noticed engineers still testing the engine. \"Would you mind {10} behind the yellow line?\" a friendly crew member asked. He explained that they {11} the batteries since dawn and hoped they {12} finish before sunset. \"If the sea {13} calm tomorrow, we'll run one final trial,\" he added. \"If only the wind {14} down a little — it's been blowing straight from the north all week!\""}
 ],
 items:[
  {o:["Setting off","Set off"], a:0, en:"Active present participle: we set off ourselves.", ru:"Активное причастие I: мы сами выехали."},
  {o:["building","built"], a:1, en:"Passive past participle: the house was built in 1928.", ru:"Пассивное причастие II: дом был построен."},
  {o:["to be designed","to have been designed"], a:1, en:"Designed in the past (1928) → perfect passive infinitive.", ru:"Спроектирован в прошлом (1928) → перфектный пассивный инфинитив."},
  {o:["had been falling","has been falling"], a:0, en:"Duration before a past moment (‘By the time we arrived’) → Past Perfect Continuous.", ru:"Длительность до момента в прошлом (By the time we arrived) → Past Perfect Continuous."},
  {o:["Despite","Although"], a:0, en:"Despite + noun phrase (‘the heavy drizzle’).", ru:"Despite + существительное (без глагола)."},
  {o:["fix","fixed"], a:1, en:"It's high time + subject + Past Simple.", ru:"It's high time + подлежащее + Past Simple."},
  {o:["hadn't been","weren't"], a:0, en:"Third conditional about a past period (‘back in May’) → had(n't) been.", ru:"Третий тип о прошлом (back in May) → hadn't been."},
  {o:["give","giving"], a:1, en:"on the verge of + V-ing.", ru:"После on the verge of всегда идёт герундий (V-ing)."},
  {o:["is to make","is about to make"], a:0, en:"Official scheduled date (‘next Tuesday’) → be to + V1.", ru:"Официально назначенная дата (next Tuesday) → be to + V1."},
  {o:["walking","walked"], a:0, en:"Simultaneous action in active voice → present participle.", ru:"Одновременное действие в активе → Причастие I."},
  {o:["to step","stepping"], a:1, en:"Would you mind + V-ing.", ru:"После Would you mind ставится V-ing без to."},
  {o:["had been checking","were checking"], a:0, en:"‘since dawn’ up to a past reporting moment (‘He explained’) → Past Perfect Continuous.", ru:"‘since dawn’ до момента речи в прошлом → Past Perfect Continuous."},
  {o:["would can","would be able to"], a:1, en:"Future-in-the-past ability: would be able to + V1 (‘would can’ is impossible).", ru:"Возможность в будущем в прошедшем: would be able to + V1."},
  {o:["stays","will stay"], a:0, en:"First conditional: if + Present Simple (no ‘will’).", ru:"Первый тип условных: после if идёт Present Simple без will."},
  {o:["would calm","calmed"], a:0, en:"If only + would expresses a wish for a current irritating situation (the wind) to change.", ru:"If only + would выражает желание, чтобы надоевшая ситуация (ветер) изменилась."}
 ]
},

/* 4. ERROR HUNT */
{
 id:"hunt", title:"4. Error Hunt", type:"hunt",
 intro:"Each text contains 6 hidden grammar mistakes (one single wrong word per mistake). Click the wrong words directly in the text to fix them!",
 passages:[
  {title:"Text A: An Email to Clara",

/* ================= HELPERS ================= */
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”".,!?;:—–-]/g," ")
    .replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/n't\b/g," not")
    .replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'re\b/g," are").replace(/'m\b/g," am")
    .replace(/\bit's\b/g,"it is").replace(/\bhe's\b/g,"he is").replace(/\bshe's\b/g,"she is")
    .replace(/\s+/g," ").trim();
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const state={}, given={};
const K=(ex,i)=>ex+"-"+i;

function mark(exId,i,d,how){
  const k=K(exId,i);
  if(how==="solved" && state[k]!=="revealed"){state[k]="solved"; if(d) d.classList.add("solved");}
  if(how==="revealed" && state[k]!=="solved"){state[k]="revealed"; if(d) d.classList.add("revealed");}
  totals();
}
function feedback(fb,kind,head,it){
  fb.className="fb "+kind;
  fb.innerHTML=`<b>${head}</b><span class="en">${esc(it.en)}</span><span class="ru" hidden>${esc(it.ru)}</span>
    <span class="fbtools"><button class="btn small" data-act="rus">RUS</button></span>`;
  fb.querySelector('[data-act="rus"]').onclick=()=>{const r=fb.querySelector(".ru"); r.hidden=!r.hidden;};
}
function totals(){
  let all=0,ok=0;
  EX.forEach(ex=>{
    let s=0; ex.items.forEach((_,i)=>{if(state[K(ex.id,i)]==="solved") s++;});
    all+=ex.items.length; ok+=s;
    const m=document.getElementById("mini-"+ex.id); if(m) m.textContent=`${s}/${ex.items.length}`;
  });
  document.getElementById("totalScore").textContent=`Score: ${ok} / ${all}`;
}
function itemBox(ex,i,inner){
  const d=document.createElement("div"); d.className="item"; d.id="it-"+K(ex.id,i); d.innerHTML=inner; return d;
}
function matches(input,answers){const n=norm(input); return n!=="" && answers.some(a=>norm(a)===n);}
function detShuffle(n,seed){
  const idx=[...Array(n).keys()];
  let s=(seed+1)*9301+49297;
  for(let i=n-1;i>0;i--){
    s=(s*9301+49297)%233280;
    const j=s%(i+1);
    [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  if(idx.every((v,k)=>v===k) && n>1){[idx[0],idx[1]]=[idx[1],idx[0]];}
  return idx;
}

/* ================= BUILDERS ================= */
const L=j=>String.fromCharCode(97+j);

/* 1. Sentence Builder */
function buildBuilder(ex,p){
  ex.items.forEach((it,i)=>{
    const perm=detShuffle(it.chunks.length,i+7);
    const d=itemBox(ex,i,`
      <div class="q"><span class="n">${i+1}.</span>${esc(it.cue)}</div>
      <div class="built"></div>
      <div class="bank">${perm.map(idx=>`<button type="button" class="tile" data-idx="${idx}">${esc(it.chunks[idx])}</button>`).join("")}</div>
      <div class="row">
        <button type="button" class="btn check">Check</button>
        <button type="button" class="btn ans" data-act="clr">Clear</button>
        <button type="button" class="btn ans" data-act="ans">Answer</button>
      </div>
      <div class="fb"></div>`);
    const built=d.querySelector(".built"), bank=d.querySelector(".bank"), fb=d.querySelector(".fb");
    const syncGiven=()=>{given[K(ex.id,i)]=[...built.querySelectorAll(".tile")].map(t=>t.textContent).join(" ");};
    const addToBuilt=(idx)=>{
      const orig=bank.querySelector(`.tile[data-idx="${idx}"]`);
      if(!orig || orig.classList.contains("used")) return;
      orig.classList.add("used");
      const clone=document.createElement("button");
      clone.type="button"; clone.className="tile"; clone.dataset.idx=idx; clone.textContent=orig.textContent;
      clone.onclick=()=>{clone.remove(); orig.classList.remove("used"); syncGiven();};
      built.appendChild(clone); syncGiven();
    };
    bank.querySelectorAll(".tile").forEach(t=>t.onclick=()=>addToBuilt(t.dataset.idx));
    const clearBuilt=()=>{built.innerHTML=""; bank.querySelectorAll(".tile").forEach(t=>t.classList.remove("used")); syncGiven();};
    d.querySelector('[data-act="clr"]').onclick=()=>{clearBuilt(); fb.className="fb";};
    d.querySelector(".check").onclick=()=>{
      const ans=[...built.querySelectorAll(".tile")].map(t=>t.textContent).join(" ");
      if(!ans){fb.className="fb bad"; fb.innerHTML="<b>Click the word tiles first to build the sentence.</b>"; return;}
      const valid=[it.chunks.join(" "), ...(it.alt||[])];
      if(matches(ans,valid)){feedback(fb,"ok","✓ Correct!",it); mark(ex.id,i,d,"solved");}
      else {feedback(fb,"bad","✗ Not quite right. Check the word order and try again.",it);}
    };
    d.querySelector('[data-act="ans"]').onclick=()=>{
      clearBuilt();
      it.chunks.forEach((_,idx)=>addToBuilt(String(idx)));
      feedback(fb,"info","Answer: "+esc(it.chunks.join(" ")),it);
      mark(ex.id,i,d,"revealed");
    };
    p.appendChild(d);
  });
}

/* 2. Key Word Rewrite */
function buildRewrite(ex,p){
  ex.items.forEach((it,i)=>{
    const d=itemBox(ex,i,`
      <div class="q"><span class="n">${i+1}.</span>${esc(it.orig)} <span class="rubr">${esc(it.key)}</span></div>
      <div class="rw-line">
        ${it.pre?`<span>${esc(it.pre)}</span>`:""}
        <input type="text" id="rw-${K(ex.id,i)}" autocomplete="off" spellcheck="false" placeholder="Type the missing part...">
        ${it.post?`<span>${esc(it.post)}</span>`:""}
      </div>
      <div class="row">
        <button type="button" class="btn check">Check</button>
        <button type="button" class="btn ans">Answer</button>
      </div>
      <div class="fb"></div>`);
    const inp=d.querySelector("input"), fb=d.querySelector(".fb");
    const check=()=>{
      given[K(ex.id,i)]=inp.value.trim();
      inp.classList.remove("okc","badc","infoc");
      if(matches(inp.value,it.a)){inp.classList.add("okc"); feedback(fb,"ok","✓ Correct!",it); mark(ex.id,i,d,"solved");}
      else {if(inp.value.trim()) inp.classList.add("badc"); feedback(fb,"bad","✗ Not quite. Check the verb form and try again.",it);}
    };
    inp.oninput=()=>{given[K(ex.id,i)]=inp.value.trim();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter") check();});
    d.querySelector(".check").onclick=check;
    d.querySelector(".ans").onclick=()=>{
      inp.value=it.a[0]; inp.classList.remove("okc","badc"); inp.classList.add("infoc");
      given[K(ex.id,i)]=it.a[0];
      feedback(fb,"info",`Answer: ${esc(it.pre)}${esc(it.a[0])}${esc(it.post)}`,it);
      mark(ex.id,i,d,"revealed");
    };
    p.appendChild(d);
  });
}

/* 3. Story: Inline Choice */
function buildStoryChoice(ex,p){
  const fbw=document.createElement("div");
  fbw.className="item";
  fbw.innerHTML=`<div class="fb" style="margin-left:0"></div><p class="hint">Click any choice in the stories above to see the explanation here.</p>`;
  const fb=fbw.querySelector(".fb"), hint=fbw.querySelector(".hint");

  ex.stories.forEach(st=>{
    const box=document.createElement("div");
    box.className="text";
    const body=esc(st.text).replace(/\{(\d+)\}/g,(m,n)=>{
      const i=+n, it=ex.items[i];
      return `<span class="pair" data-i="${i}"><span class="gn">(${i+1})</span><button type="button" class="choice" data-j="0">${esc(it.o[0])}</button><span class="slash">/</span><button type="button" class="choice" data-j="1">${esc(it.o[1])}</button><button type="button" class="btn ans q-ans" data-a="${i}">?</button></span>`;
    });
    box.innerHTML=`<h3>${esc(st.title)}</h3><div>${body}</div>`;
    box.querySelectorAll(".pair").forEach(pair=>{
      const i=+pair.dataset.i, it=ex.items[i], btns=pair.querySelectorAll(".choice");
      btns.forEach(b=>b.onclick=()=>{
        const j=+b.dataset.j;
        given[K(ex.id,i)]=it.o[j];
        hint.hidden=true;
        if(j===it.a){
          btns.forEach(x=>x.classList.remove("wrong"));
          b.classList.add("right");
          feedback(fb,"ok",`✓ (${i+1}) Correct!`,it);
          mark(ex.id,i,pair,"solved");
        } else {
          b.classList.add("wrong");
          feedback(fb,"bad",`✗ (${i+1}) Not quite. Try the other option.`,it);
        }
      });
      pair.querySelector(".q-ans").onclick=()=>{
        btns[it.a].classList.add("right");
        given[K(ex.id,i)]=it.o[it.a];
        hint.hidden=true;
        feedback(fb,"info",`(${i+1}) Answer: ${esc(it.o[it.a])}`,it);
        mark(ex.id,i,pair,"revealed");
      };
    });
    p.appendChild(box);
  });
  p.appendChild(fbw);
}

/* 4. Error Hunt */
function buildHunt(ex,p){
  const fbw=document.createElement("div");
  fbw.className="item";
  fbw.innerHTML=`<div class="fb" style="margin-left:0"></div><p class="hint">Click a wrong word in either text to fix it and read the explanation here.</p>`;
  const fb=fbw.querySelector(".fb"), hint=fbw.querySelector(".hint");

  ex.passages.forEach(ps=>{
    const card=document.createElement("div");
    card.className="item hunt";
    const errIds=[];
    // Parse [wrong|fix|idx] tokens, make every regular word clickable too
    const parts=ps.raw.split(/(\[[^\]]+\])/g);
    let html="";
    parts.forEach(seg=>{
      if(seg.startsWith("[") && seg.endsWith("]")){
        const [wrong,fix,idxStr]=seg.slice(1,-1).split("|");
        const idx=+idxStr;
        errIds.push(idx);
        html+=`<span class="w" data-err="${idx}" data-fix="${esc(fix)}">${esc(wrong)}</span>`;
      } else {
        html+=seg.replace(/([A-Za-z0-9’']+)/g,m=>`<span class="w">${esc(m)}</span>`);
      }
    });
    card.innerHTML=`<h3><span>${esc(ps.title)}</span><span class="cnt">Found: 0 / ${errIds.length}</span></h3>
      <div class="body">${html}</div>
      <div class="row" style="padding-left:0"><button type="button" class="btn ans">Show remaining answers</button></div>`;
    const cntEl=card.querySelector(".cnt");
    const updateCnt=()=>{
      const done=errIds.filter(id=>state[K(ex.id,id)]==="solved" || state[K(ex.id,id)]==="revealed").length;
      cntEl.textContent=`Found: ${done} / ${errIds.length}`;
    };
    const revealSpan=(sp,how)=>{
      const idx=+sp.dataset.err, fix=sp.dataset.fix, it=ex.items[idx];
      if(sp.dataset.done) return;
      sp.dataset.done="1";
      sp.classList.add(how==="solved"?"hit":"shown");
      const corr=document.createElement("span");
      corr.className="corr"; corr.textContent=fix;
      sp.insertAdjacentElement("afterend",corr);
      given[K(ex.id,idx)]=`${sp.textContent} → ${fix}`;
      mark(ex.id,idx,null,how);
      updateCnt();
      hint.hidden=true;
      feedback(fb,how==="solved"?"ok":"info",`${how==="solved"?"✓ Found":"Answer"}: “${sp.textContent}” → “${fix}”`,it);
    };
    card.querySelectorAll(".w").forEach(sp=>sp.onclick=()=>{
      if(sp.dataset.err!==undefined){
        revealSpan(sp,"solved");
      } else {
        sp.classList.add("miss");
        setTimeout(()=>sp.classList.remove("miss"),650);
      }
    });
    card.querySelector(".ans").onclick=()=>{
      card.querySelectorAll(".w[data-err]").forEach(sp=>{if(!sp.dataset.done) revealSpan(sp,"revealed");});
    };
    p.appendChild(card);
  });
  p.appendChild(fbw);
}

/* 5. Tick All Correct (Multi-select) */
function buildMulti(ex,p){
  ex.items.forEach((it,i)=>{
    const d=itemBox(ex,i,`
      <div class="q"><span class="n">${i+1}.</span>Tick all correct sentences <span class="need">${it.need} correct</span></div>
      <div class="opts">${it.o.map((o,j)=>`<button type="button" class="opt" data-j="${j}">${L(j)}) ${esc(o)}</button>`).join("")}</div>
      <div class="row">
        <button type="button" class="btn check">Check</button>
        <button type="button" class="btn ans">Answer</button>
      </div>
      <div class="fb"></div>`);
    const opts=[...d.querySelectorAll(".opt")], fb=d.querySelector(".fb");
    const syncGiven=()=>{
      const sel=opts.filter(b=>b.classList.contains("sel")).map(b=>L(+b.dataset.j));
      given[K(ex.id,i)]=sel.length?sel.join(", "):"—";
    };
    opts.forEach(b=>b.onclick=()=>{
      b.classList.remove("right","wrong");
      b.classList.toggle("sel");
      syncGiven();
    });
    d.querySelector(".check").onclick=()=>{
      const sel=opts.filter(b=>b.classList.contains("sel")).map(b=>+b.dataset.j);
      if(sel.length!==it.need){
        fb.className="fb bad";
        fb.innerHTML=`<b>Select exactly ${it.need} sentences first (currently selected: ${sel.length}).</b>`;
        return;
      }
      opts.forEach(b=>b.classList.remove("right","wrong"));
      let allGood=true;
      sel.forEach(j=>{
        if(it.a.includes(j)) opts[j].classList.add("right");
        else {opts[j].classList.add("wrong"); allGood=false;}
      });
      if(allGood){feedback(fb,"ok","✓ Correct!",it); mark(ex.id,i,d,"solved");}
      else {feedback(fb,"bad","✗ Not quite. Deselect the red sentence(s) and try again.",it);}
    };
    d.querySelector(".ans").onclick=()=>{
      opts.forEach((b,j)=>{
        b.classList.remove("sel","right","wrong");
        if(it.a.includes(j)) b.classList.add("sel","right");
      });
      given[K(ex.id,i)]=it.a.map(L).join(", ");
      feedback(fb,"info","Answer: "+it.a.map(j=>L(j)+")").join(", "),it);
      mark(ex.id,i,d,"revealed");
    };
    p.appendChild(d);
  });
}

/* 6. Translation (RU -> EN) */
function buildTranslate(ex,p){
  ex.items.forEach((it,i)=>{
    const d=itemBox(ex,i,`
      <div class="q tr"><span class="n">${i+1}.</span><span class="ru-src">${esc(it.ru_src)}</span></div>
      <div class="row">
        <input type="text" class="wide" autocomplete="off" spellcheck="false" placeholder="Type your English translation...">
        <button type="button" class="btn check">Check</button>
        <button type="button" class="btn ans">Answer</button>
      </div>
      <div class="tr"><div class="en-out">Model: ${esc(it.model)}</div></div>
      <div class="fb"></div>`);
    const inp=d.querySelector("input"), out=d.querySelector(".en-out"), fb=d.querySelector(".fb");
    const check=()=>{
      given[K(ex.id,i)]=inp.value.trim();
      inp.classList.remove("okc","badc","infoc");
      if(matches(inp.value,it.a)){
        inp.classList.add("okc");
        feedback(fb,"ok","✓ Correct!",it);
        mark(ex.id,i,d,"solved");
      } else {
        if(inp.value.trim()) inp.classList.add("badc");
        feedback(fb,"bad","✗ Not quite matching the target structure yet. Check the grammar or click Answer to compare.",it);
      }
    };
    inp.oninput=()=>{given[K(ex.id,i)]=inp.value.trim();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter") check();});
    d.querySelector(".check").onclick=check;
    d.querySelector(".ans").onclick=()=>{
      out.classList.add("show");
      inp.classList.remove("okc","badc"); inp.classList.add("infoc");
      if(!inp.value.trim()) inp.value=it.model;
      given[K(ex.id,i)]=inp.value.trim();
      feedback(fb,"info","Model translation shown above.",it);
      mark(ex.id,i,d,"revealed");
    };
    p.appendChild(d);
  });
}

/* ================= PAGE ================= */
const tabs=document.getElementById("tabs"), pages=document.getElementById("pages");
const B={
  builder:buildBuilder,
  rewrite:buildRewrite,
  storychoice:buildStoryChoice,
  hunt:buildHunt,
  multi:buildMulti,
  translate:buildTranslate
};
EX.forEach(ex=>{
  const b=document.createElement("button"); b.id="tab-"+ex.id;
  b.innerHTML=`${ex.title}<span class="mini" id="mini-${ex.id}"></span>`; b.onclick=()=>show(ex.id); tabs.appendChild(b);
  const p=document.createElement("section"); p.className="page"; p.id="page-"+ex.id;
  p.innerHTML=`<div class="intro"><h2>${ex.title}</h2><p>${ex.intro}</p></div>`;
  B[ex.type](ex,p);
  const t=document.createElement("div"); t.className="tools";
  t.innerHTML=`<button type="button" class="btn copy">Copy my answers</button><button type="button" class="btn reset">Reset this exercise</button><span class="copied" hidden>Copied!</span>`;
  t.querySelector(".copy").onclick=()=>copyAnswers(ex,t.querySelector(".copied"));
  t.querySelector(".reset").onclick=()=>resetEx(ex);
  p.appendChild(t);
  pages.appendChild(p);
});
function copyAnswers(ex,flag){
  const lines=[ex.title];
  ex.items.forEach((it,i)=>{
    const a=given[K(ex.id,i)]||"—"; const st=state[K(ex.id,i)];
    lines.push(`${i+1}. ${a}${st==="solved"?" ✓":st==="revealed"?" (answer shown)":""}`);
  });
  const text=lines.join("\n");
  const done=()=>{flag.hidden=false; setTimeout(()=>flag.hidden=true,1800);};
  const fallback=()=>{const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy");}catch(e){} ta.remove(); done();};
  try{ navigator.clipboard.writeText(text).then(done,fallback); }catch(e){ fallback(); }
}
function resetEx(ex){
  ex.items.forEach((_,i)=>{delete state[K(ex.id,i)]; delete given[K(ex.id,i)];});
  const page=document.getElementById("page-"+ex.id); const fresh=document.createElement("section");
  fresh.className=page.className; fresh.id=page.id; fresh.innerHTML=`<div class="intro"><h2>${ex.title}</h2><p>${ex.intro}</p></div>`;
  B[ex.type](ex,fresh);
  const tools=page.querySelector(".tools"); fresh.appendChild(tools); page.replaceWith(fresh); totals();
}
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id==="page-"+id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.id==="tab-"+id));
  window.scrollTo({top:0});
}
show(EX[0].id); totals();
</script>
