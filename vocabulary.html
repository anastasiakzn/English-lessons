<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-group · Vocabulary Flashcard Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#F6F5F8; --card:#FFFFFF; --ink:#241C2B; --ink-soft:#5B5266;
    --line:#E0DCE6; --plum:#4A2C4D; --plum-soft:#7A5A7D; --gold:#8F6512;
    --good:#2A7340; --good-bg:#E9F4ED; --bad:#AE3434; --bad-bg:#FAEBEB;
    --chip:#F0ECF3; --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#17141B; --card:#211C28; --ink:#EDE8F2; --ink-soft:#AFA5BC;
      --line:#352E3E; --plum:#D9B6DC; --plum-soft:#A98FAD; --gold:#E0B454;
      --good:#78CE92; --good-bg:#1B2E22; --bad:#F09292; --bad-bg:#31201F;
      --chip:#2B2433;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#17141B; --card:#211C28; --ink:#EDE8F2; --ink-soft:#AFA5BC;
    --line:#352E3E; --plum:#D9B6DC; --plum-soft:#A98FAD; --gold:#E0B454;
    --good:#78CE92; --good-bg:#1B2E22; --bad:#F09292; --bad-bg:#31201F;
    --chip:#2B2433;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.55;
  }
  .wrap{max-width:960px; margin:0 auto; padding-inline:16px; padding-block:22px 56px;}

  header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--plum-soft); font-weight:700;}
  h1{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:clamp(25px,5vw,35px); margin:0; line-height:1.1; text-wrap:balance;}
  .meta{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  .rusbtn{
    font-family:inherit; font-size:12px; font-weight:700; letter-spacing:.06em;
    padding:7px 13px; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--plum); border:1.5px solid var(--plum);
  }
  .rusbtn[aria-pressed="true"]{background:var(--plum); color:var(--paper);}

  /* Toolbar */
  .toolbar{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; margin-bottom:16px; display:flex; flex-direction:column; gap:12px;
  }
  .controls-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .search-box{flex:1 1 230px; position:relative;}
  .search-box input{
    width:100%; font-family:inherit; font-size:15px;
    padding:8px 34px 8px 13px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  }
  .search-clear{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    border:none; background:transparent; color:var(--ink-soft); font-size:15px;
    cursor:pointer; display:none; padding:2px 6px;
  }
  .search-clear.show{display:block;}

  .btn-group{display:flex; gap:7px; flex-wrap:wrap; align-items:center;}
  .pill-btn{
    font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    padding:7px 13px; border-radius:999px; border:1.5px solid var(--plum);
    background:transparent; color:var(--plum); white-space:nowrap;
  }
  .pill-btn.solid{background:var(--plum); color:var(--paper);}
  .pill-btn.gold{border-color:var(--gold); color:var(--gold);}
  .pill-btn.gold.solid{background:var(--gold); color:var(--paper);}

  /* Topic Filter Chips */
  .topics{display:flex; gap:6px; flex-wrap:wrap; padding-top:6px; border-top:1px solid var(--line);}
  .tchip{
    font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    padding:6px 12px; border-radius:999px; border:1px solid transparent;
    background:var(--chip); color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;
  }
  .tchip .cnt{
    font-size:11px; padding:1px 6px; border-radius:999px;
    background:var(--card); color:var(--plum-soft);
  }
  .tchip[aria-pressed="true"]{background:var(--plum); color:var(--paper);}
  .tchip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.22); color:var(--paper);}

  .status-bar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    font-size:13.5px; color:var(--ink-soft); margin-bottom:12px; padding-inline:4px;
  }
  .status-bar b{color:var(--plum);}

  [hidden]{display:none!important}

  /* Grid View Cards */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(265px,1fr)); gap:13px;}
  .vc{
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:14px 15px; cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:4px; position:relative;
    transition:transform .12s, border-color .15s;
  }
  .vc:hover{transform:translateY(-2px); border-color:var(--plum-soft);}
  .vc.known{border-color:var(--good); background:var(--good-bg);}
  .vc .tag-row{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:2px;}
  .vc .ltag{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--plum-soft); font-weight:700;}
  .vc .en{font-family:"Fraunces",Georgia,serif; font-size:19.5px; font-weight:600; line-height:1.2; display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--ink);}
  .vc .tr{font-size:13px; color:var(--plum-soft);}
  .vc .df{font-size:13.5px; color:var(--ink-soft); line-height:1.4; margin-top:2px;}

  /* Example box inside card */
  .vc .exbox{
    margin-top:6px; padding:7px 10px; border-radius:9px;
    background:var(--chip); border-left:2.5px solid var(--plum-soft);
    font-size:13.5px; line-height:1.4; color:var(--ink);
    display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
  }
  .vc.known .exbox{background:var(--card);}
  .vc .exbox em{font-style:italic;}

  .vc .rux{display:none; margin-top:7px; padding-top:7px; border-top:1px solid var(--line); font-size:15.5px; font-weight:700; color:var(--plum);}
  .vc.flip .rux, body.showrus .vc .rux{display:block;}
  .vc .tap{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--plum-soft); margin-top:6px;}
  .vc.flip .tap, body.showrus .vc .tap{display:none;}

  .mini{
    font-family:inherit; font-size:10.5px; font-weight:700; letter-spacing:.09em;
    padding:4px 9px; border-radius:999px; cursor:pointer; vertical-align:middle;
    background:transparent; color:var(--plum-soft); border:1.2px solid var(--plum-soft);
    white-space:nowrap; flex:0 0 auto;
  }
  .mini:hover{background:var(--chip);}
  .mini.ex-say{padding:2px 7px; font-size:9.5px;}
  .mini.know-btn{border-color:var(--line); color:var(--ink-soft); padding:2px 8px; font-size:10px; letter-spacing:.03em;}
  .vc.known .mini.know-btn{border-color:var(--good); color:var(--good); background:var(--card);}

  /* Focus Study Mode (1 card at a time) */
  .study-wrap{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:24px 20px; max-width:580px; margin:10px auto 0; text-align:center;
  }
  .study-progress{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--plum-soft); font-weight:700; margin-bottom:14px;}
  .study-card{
    background:var(--chip); border:1.5px solid var(--line); border-radius:16px;
    padding:26px 22px; min-height:240px; cursor:pointer;
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px;
  }
  .study-card.known{border-color:var(--good); background:var(--good-bg);}
  .study-topic{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--plum-soft); font-weight:700;}
  .study-en{font-family:"Fraunces",Georgia,serif; font-size:clamp(26px,5vw,34px); font-weight:600; color:var(--ink); line-height:1.2;}
  .study-tr{font-size:15px; color:var(--plum-soft);}
  .study-df{font-size:15px; color:var(--ink-soft); max-width:440px; margin-top:2px;}
  .study-ex{
    margin-top:8px; padding:10px 14px; border-radius:11px;
    background:var(--card); border:1px solid var(--line);
    font-size:15px; font-style:italic; color:var(--ink);
    display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
  }
  .study-ru{
    display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    font-size:19px; font-weight:700; color:var(--plum); width:100%;
  }
  .study-card.flip .study-ru, body.showrus .study-card .study-ru{display:block;}
  .study-tap{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--plum-soft); margin-top:10px;}
  .study-card.flip .study-tap, body.showrus .study-card .study-tap{display:none;}
  .study-nav{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px;}

  .empty{text-align:center; padding:36px 16px; color:var(--ink-soft); font-size:15px;}
  .tab:focus-visible,button:focus-visible,input:focus-visible,.vc:focus-visible,.study-card:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">

      <span class="eyebrow">Mini-group · Petrozavodsk</span>
      <h1>Vocabulary Flashcard Bank</h1>
      <div class="meta" id="subtitleMeta">База карточек с примерами · Уроки 1–15 (Октябрь – Ноябрь)</div>
    </div>
    <div class="top-actions">
      <button class="rusbtn" id="rusbtn" aria-pressed="false">SHOW ALL RUS · Перевод всех</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="controls-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск на английском или русском…" autocomplete="off">
        <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
      </div>
      <div class="btn-group">
        <button type="button" class="pill-btn solid" id="modeGridBtn">Grid view · Сетка</button>
        <button type="button" class="pill-btn" id="modeStudyBtn">1-card drill · По одной</button>
        <button type="button" class="pill-btn gold" id="shuffleBtn">🔀 Shuffle · Перемешать</button>
        <button type="button" class="pill-btn" id="onlyUnlearnedBtn" aria-pressed="false">To practice only · Невыученные</button>
      </div>
    </div>
    <div class="topics" id="topicBar" role="group" aria-label="Filter by lesson topic"></div>
  </div>

  <div class="status-bar">
    <span id="countInfo">Showing <b>0</b> cards</span>
    <span>Нажмите на карточку для перевода · <b>▶</b> — озвучить слово или пример</span>
  </div>

  <div id="gridContainer" class="cards"></div>
  <div id="studyContainer" hidden></div>
</div>

  DECK.forEach(function(item, idx){ item.id = idx; });

  /* Speech Synthesis (female UK voice preference matching all lessons) */
  var canSpeak = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
  var femaleVoice = null;
  function pickVoice(){
    try{
      var vs = window.speechSynthesis.getVoices() || [];
      var en = vs.filter(function(v){ return /^en[-_]/i.test(v.lang); });
      var female = /female|woman|serena|kate|stephanie|martha|libby|sonia|hazel|susan|samantha|karen|moira|tessa|fiona|victoria|allison|ava|zira|aria|jenny|emma|amy|joanna|salli|kimberly/i;
      var male = /\bmale\b|daniel|arthur|oliver|george|ryan|thomas|alex|fred|rishi|aaron|guy|david|mark|james/i;
      var gb = en.filter(function(v){ return /en[-_]gb/i.test(v.lang); });
      femaleVoice =
        gb.filter(function(v){ return female.test(v.name) && !/\bmale\b/i.test(v.name.replace(/female/i, "")); })[0] ||
        en.filter(function(v){ return female.test(v.name) && !/\bmale\b/i.test(v.name.replace(/female/i, "")); })[0] ||
        gb.filter(function(v){ return !male.test(v.name); })[0] ||
        en.filter(function(v){ return !male.test(v.name); })[0] ||
        null;
    }catch(e){ femaleVoice = null; }
  }
  if(canSpeak){
    pickVoice();
    try{ window.speechSynthesis.addEventListener("voiceschanged", pickVoice); }catch(e){}
  }
  function speak(t, rate){
    if(!canSpeak) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      if(!femaleVoice) pickVoice();
      if(femaleVoice){ u.voice = femaleVoice; u.lang = femaleVoice.lang; }
      else { u.lang = "en-GB"; u.pitch = 1.25; }
      u.rate = rate || 0.85;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function sayBtn(text, extraCls){
    if(!canSpeak) return null;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "mini" + (extraCls ? " " + extraCls : "");
    b.textContent = "▶";
    b.setAttribute("aria-label", "Listen");
    b.addEventListener("click", function(e){ e.stopPropagation(); speak(text, 0.85); });
    return b;
  }
  function el(tag, cls, txt){
    var d = document.createElement(tag);
    if(cls) d.className = cls;
    if(txt !== undefined) d.textContent = txt;
    return d;
  }

  /* Local storage for "Learned" progress */
  var STORAGE_KEY = "petrozavodsk_moms_vocab_known_v1";
  var knownMap = {};
  try{
    knownMap = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
  }catch(e){ knownMap = {}; }
  function saveKnown(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(knownMap)); }catch(e){}
  }
  function isKnown(item){ return !!knownMap[item.en.toLowerCase()]; }
  function toggleKnown(item){
    var k = item.en.toLowerCase();
    if(knownMap[k]) delete knownMap[k];
    else knownMap[k] = true;
    saveKnown();
  }

  /* State */
  var currentOrder = DECK.slice();
  var activeTopic = "ALL";
  var searchQuery = "";
  var onlyUnlearned = false;
  var viewMode = "grid";
  var studyIdx = 0;

  /* Build Topic Filter Chips */
  var topicBar = document.getElementById("topicBar");
  var topicCounts = {};
  var topicList = [];
  DECK.forEach(function(item){
    if(!topicCounts[item.topic]){
      topicCounts[item.topic] = 0;
      topicList.push(item.topic);
    }
    topicCounts[item.topic]++;
  });

  function renderTopicChips(){
    topicBar.innerHTML = "";
    var allBtn = el("button", "tchip");
    allBtn.type = "button";
    allBtn.setAttribute("aria-pressed", activeTopic === "ALL" ? "true" : "false");
    allBtn.appendChild(document.createTextNode("All topics · Все темы "));
    allBtn.appendChild(el("span", "cnt", String(DECK.length)));
    allBtn.addEventListener("click", function(){
      activeTopic = "ALL"; studyIdx = 0; renderTopicChips(); renderView();
    });
    topicBar.appendChild(allBtn);

    topicList.forEach(function(tp){
      var b = el("button", "tchip");
      b.type = "button";
      b.setAttribute("aria-pressed", activeTopic === tp ? "true" : "false");
      b.appendChild(document.createTextNode(tp + " "));
      b.appendChild(el("span", "cnt", String(topicCounts[tp])));
      b.addEventListener("click", function(){
        activeTopic = tp; studyIdx = 0; renderTopicChips(); renderView();
      });
      topicBar.appendChild(b);
    });
  }

  function getFiltered(){
    var q = searchQuery.trim().toLowerCase();
    return currentOrder.filter(function(item){
      if(activeTopic !== "ALL" && item.topic !== activeTopic) return false;
      if(onlyUnlearned && isKnown(item)) return false;
      if(q){
        var hay = (item.en + " " + item.ru + " " + item.df + " " + (item.ex || "") + " " + item.lesson).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderGrid(list){
    var grid = document.getElementById("gridContainer");
    grid.innerHTML = "";
    if(!list.length){
      grid.appendChild(el("div", "empty", "Ничего не найдено. Попробуйте очистить поиск или выбрать другую тему."));
      return;
    }
    list.forEach(function(w){
      var d = el("div", "vc" + (isKnown(w) ? " known" : ""));
      d.tabIndex = 0; d.setAttribute("role", "button");

      var tagRow = el("div", "tag-row");
      tagRow.appendChild(el("span", "ltag", w.lesson));
      var kb = el("button", "mini know-btn", isKnown(w) ? "✓ Выучено" : "Отметить выученным");
      kb.type = "button";
      kb.addEventListener("click", function(e){
        e.stopPropagation();
        toggleKnown(w);
        renderView();
      });
      tagRow.appendChild(kb);
      d.appendChild(tagRow);

      var en = el("span", "en");
      en.appendChild(document.createTextNode(w.en));
      var sb = sayBtn(w.en);
      if(sb) en.appendChild(sb);
      d.appendChild(en);

      d.appendChild(el("span", "tr", w.tr));
      d.appendChild(el("span", "df", w.df));

      if(w.ex){
        var exBox = el("div", "exbox");
        var exTxt = el("em", null, w.ex);
        exBox.appendChild(exTxt);
        var sbEx = sayBtn(w.ex, "ex-say");
        if(sbEx) exBox.appendChild(sbEx);
        d.appendChild(exBox);
      }

      d.appendChild(el("span", "rux", w.ru));
      d.appendChild(el("span", "tap", "нажмите, чтобы увидеть перевод"));

      function flip(){ d.classList.toggle("flip"); }
      d.addEventListener("click", flip);
      d.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); } });
      grid.appendChild(d);
    });
  }

  function renderStudy(list){
    var host = document.getElementById("studyContainer");
    host.innerHTML = "";
    if(!list.length){
      host.appendChild(el("div", "empty", "В этой подборке нет карточек. Выберите другую тему или отключите фильтр «Невыученные»."));
      return;
    }
    if(studyIdx >= list.length) studyIdx = 0;
    if(studyIdx < 0) studyIdx = list.length - 1;
    var w = list[studyIdx];

    var wrap = el("div", "study-wrap");
    wrap.appendChild(el("div", "study-progress", "Карточка " + (studyIdx + 1) + " из " + list.length + " · " + w.lesson));

    var card = el("div", "study-card" + (isKnown(w) ? " known" : ""));
    card.tabIndex = 0; card.setAttribute("role", "button");
    card.appendChild(el("div", "study-topic", w.topic));

    var enRow = el("div", "study-en");
    enRow.appendChild(document.createTextNode(w.en + " "));
    var sb = sayBtn(w.en);
    if(sb) enRow.appendChild(sb);
    card.appendChild(enRow);

    card.appendChild(el("div", "study-tr", w.tr));
    card.appendChild(el("div", "study-df", w.df));

    if(w.ex){
      var exDiv = el("div", "study-ex");
      exDiv.appendChild(document.createTextNode(w.ex));
      var sbEx = sayBtn(w.ex, "ex-say");
      if(sbEx) exDiv.appendChild(sbEx);
      card.appendChild(exDiv);
    }

    card.appendChild(el("div", "study-ru", w.ru));
    card.appendChild(el("div", "study-tap", "Нажмите на карточку, чтобы увидеть перевод"));

    function flip(){ card.classList.toggle("flip"); }
    card.addEventListener("click", flip);
    card.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); } });
    wrap.appendChild(card);

    var nav = el("div", "study-nav");
    var prev = el("button", "pill-btn", "← Назад");
    prev.type = "button";
    prev.addEventListener("click", function(){ studyIdx = (studyIdx - 1 + list.length) % list.length; renderStudy(list); });

    var knowBtn = el("button", "pill-btn gold" + (isKnown(w) ? " solid" : ""), isKnown(w) ? "✓ Выучено" : "✓ Отметить выученным");
    knowBtn.type = "button";
    knowBtn.addEventListener("click", function(){
      toggleKnown(w);
      renderView();
    });

    var next = el("button", "pill-btn solid", "Дальше →");
    next.type = "button";
    next.addEventListener("click", function(){ studyIdx = (studyIdx + 1) % list.length; renderStudy(list); });

    nav.appendChild(prev);
    nav.appendChild(knowBtn);
    nav.appendChild(next);
    wrap.appendChild(nav);
    host.appendChild(wrap);
  }

  function renderView(){
    var list = getFiltered();
    var learnedTotal = DECK.filter(isKnown).length;
    document.getElementById("countInfo").innerHTML =
      "Показано <b>" + list.length + "</b> из " + DECK.length + " карточек · Выучено: <b>" + learnedTotal + "</b>";

    var gridEl = document.getElementById("gridContainer");
    var studyEl = document.getElementById("studyContainer");
    if(viewMode === "grid"){
      gridEl.hidden = false;
      studyEl.hidden = true;
      renderGrid(list);
    } else {
      gridEl.hidden = true;
      studyEl.hidden = false;
      renderStudy(list);
    }
  }

  /* Controls */
  var searchInput = document.getElementById("searchInput");
  var searchClear = document.getElementById("searchClear");
  searchInput.addEventListener("input", function(){
    searchQuery = searchInput.value;
    searchClear.classList.toggle("show", searchQuery.length > 0);
    studyIdx = 0;
    renderView();
  });
  searchClear.addEventListener("click", function(){
    searchInput.value = "";
    searchQuery = "";
    searchClear.classList.remove("show");
    studyIdx = 0;
    renderView();
  });

  var modeGridBtn = document.getElementById("modeGridBtn");
  var modeStudyBtn = document.getElementById("modeStudyBtn");
  modeGridBtn.addEventListener("click", function(){
    viewMode = "grid";
    modeGridBtn.classList.add("solid");
    modeStudyBtn.classList.remove("solid");
    renderView();
  });
  modeStudyBtn.addEventListener("click", function(){
    viewMode = "study";
    modeStudyBtn.classList.add("solid");
    modeGridBtn.classList.remove("solid");
    renderView();
  });

  document.getElementById("shuffleBtn").addEventListener("click", function(){
    for(var i = currentOrder.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = currentOrder[i]; currentOrder[i] = currentOrder[j]; currentOrder[j] = tmp;
    }
    studyIdx = 0;
    renderView();
  });

  var onlyUnlearnedBtn = document.getElementById("onlyUnlearnedBtn");
  onlyUnlearnedBtn.addEventListener("click", function(){
    onlyUnlearned = !onlyUnlearned;
    onlyUnlearnedBtn.setAttribute("aria-pressed", onlyUnlearned ? "true" : "false");
    onlyUnlearnedBtn.classList.toggle("solid", onlyUnlearned);
    studyIdx = 0;
    renderView();
  });

  var rb = document.getElementById("rusbtn");
  rb.addEventListener("click", function(){
    var on = rb.getAttribute("aria-pressed") === "true";
    rb.setAttribute("aria-pressed", on ? "false" : "true");
    rb.textContent = on ? "SHOW ALL RUS · Перевод всех" : "HIDE ALL RUS · Скрыть перевод";
    document.body.classList.toggle("showrus", !on);
  });

  renderTopicChips();
  renderView();
})();
