<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitaliy · Translation Workout IV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f0; --surface:#ffffff; --surface2:#eceee8; --ink:#1c2230; --muted:#5d6574;
  --line:#d9dcd3; --accent:#2c5a86; --accent-ink:#ffffff; --mark:#f3d47a;
  --ok:#2d7a4c; --ok-bg:#e3f1e8; --bad:#b0413a; --bad-bg:#f8e5e3;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15181f; --surface:#1d212b; --surface2:#252a36; --ink:#e7e9ee; --muted:#9aa2b1;
    --line:#333a48; --accent:#7fb0e0; --accent-ink:#10141b; --mark:#6b5a24;
    --ok:#7ccf9c; --ok-bg:#1c3326; --bad:#f09a92; --bad-bg:#3a2020;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181f; --surface:#1d212b; --surface2:#252a36; --ink:#e7e9ee; --muted:#9aa2b1;
  --line:#333a48; --accent:#7fb0e0; --accent-ink:#10141b; --mark:#6b5a24;
  --ok:#7ccf9c; --ok-bg:#1c3326; --bad:#f09a92; --bad-bg:#3a2020;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,4vw,2rem);margin:2px 0 4px;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;font:600 .85rem var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button .n{color:var(--muted);font-weight:500;margin-right:4px;font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button[aria-selected="true"] .n{color:inherit;opacity:.75}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{padding-top:18px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:6px}
.phead h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0}
.meta{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.instr{margin:0 0 16px;color:var(--muted);max-width:68ch}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:flex-start}
.q .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;min-width:1.6em}
.q .txt{font-family:var(--serif);font-size:1.05rem;flex:1}
.sub{color:var(--muted);font-family:var(--serif)}
.sub.wrongline{color:var(--ink)}
.lbl{font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.key{font:700 .75rem var(--sans);letter-spacing:.04em;background:var(--mark);color:var(--ink);padding:2px 7px;border-radius:4px;white-space:nowrap}
.body{padding-left:calc(1.6em + 10px);display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{font:500 .95rem var(--serif);text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts{display:flex;flex-direction:column;gap:6px}
input.gap{font:500 1rem var(--sans);padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);width:min(100%,260px)}
input.gap.inl{width:min(100%,190px);margin:2px 2px}
.ok-f{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.bad-f{border-color:var(--bad)!important;background:var(--bad-bg)!important}
textarea{font:1rem var(--sans);width:100%;min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);resize:vertical}
.btn{font:600 .85rem var(--sans);padding:6px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.fb:empty{display:none}
.fb{font-size:.93rem}
.good{color:var(--ok);font-weight:600}
.wrong{color:var(--bad);font-weight:600}
.ru{color:var(--muted)}
.model{background:var(--surface2);border-radius:6px;padding:8px 10px;font-family:var(--serif)}
.model small{display:block;font-family:var(--sans);color:var(--muted);margin-top:4px}
.inline{font-family:var(--serif);font-size:1.05rem;line-height:2.1}
.inline i{color:var(--muted)}
.pool,.built{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:6px;border-radius:8px}
.built{border:1px dashed var(--line);background:var(--surface2)}
.built.ok-f,.built.bad-f{border-style:solid}
.tile{font:500 .98rem var(--serif);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:6px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:999px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px}
.half{display:flex;flex-direction:column;gap:6px}
.words{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--serif);font-size:1.05rem}
.w{border:1px solid transparent;background:none;color:var(--ink);font:inherit;padding:1px 4px;border-radius:4px;cursor:pointer}
.w:hover{border-color:var(--line);background:var(--surface2)}
.w.hit{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.w.miss{color:var(--muted)}
.btn.listen{font-size:.75rem;padding:2px 8px;vertical-align:middle}
.who{display:inline-block;font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:8px}
.item.alt{margin-left:clamp(0px,4vw,28px)}
.choice{display:inline-flex;flex-wrap:wrap;gap:4px;margin:0 3px;vertical-align:middle}
.ch{font:500 .95rem var(--serif);border:1px dashed var(--accent);background:var(--surface2);color:var(--ink);padding:1px 8px;border-radius:5px;cursor:pointer}
.ch.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.ch.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.ch.off{opacity:.35;text-decoration:line-through;cursor:default}
.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.match .col{display:flex;flex-direction:column;gap:6px}
.card{font:1rem var(--serif);text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.card.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.card.bad{border-color:var(--bad);background:var(--bad-bg)}
.start{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--serif);font-size:1.05rem}
.lead{font-weight:600}
input.gap.wide{width:min(100%,520px);flex:1 1 260px}
.src{display:flex;flex-direction:column;gap:4px;font-family:var(--serif);font-size:1.03rem;line-height:1.7}
.para{gap:2px 0}
.found{display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.found:empty{display:none}
.pair{font-family:var(--serif)}
.pair s{color:var(--bad)}
.art-title{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0}
.dir{font:700 .7rem var(--sans);letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.timerbar{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.clock{font:700 1.4rem var(--sans);font-variant-numeric:tabular-nums;color:var(--accent)}
.clock.over{color:var(--bad)}
.speed{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item.tight{gap:6px;padding:10px 12px}
.item.tight input.gap{flex:1 1 140px;width:auto;min-width:0}
.opt.half-w{width:auto;flex:1 1 140px;text-align:center;font-family:var(--sans);font-weight:600}
.opt.bad-pick{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.skel{font:600 1rem ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--accent);background:var(--surface2);border-radius:6px;padding:8px 10px;word-spacing:.2em;overflow-wrap:anywhere}
.step{display:flex;flex-direction:column;gap:6px}
.step-l{display:block;margin-top:4px}
.sub.mt{color:var(--ink);text-decoration:underline wavy var(--bad);text-decoration-thickness:1px;text-underline-offset:4px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Translation Masterclass · part 5</div>
    <h1>Translation Workout IV</h1>
    <p>Vitaliy · 15 October · new word list · grammar review · 8 new formats · about 90 minutes</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="panels"></main>
</div>

<script>
/* =========================================================
   Answer patterns: {a|b} = one of the options, [x] = optional.
   Checking ignores case, punctuation, contractions and UK/US spelling.
   ========================================================= */

/* ---------- Format 1: speed round ---------- */
const C1=[
 ["подвезти её",["give her a {lift|ride}"],"give her a lift","Give sb a lift — подвезти."],
 ["потратить деньги на одежду",["spend [the ]money on clothes"],"spend money on clothes","Spend money on sth — предлог on."],
 ["примерить платье",["try on {the|a|this} dress","try {the|a|this} dress on"],"try on the dress","Try on — примерить; put on — надеть."],
 ["надеть куртку",["put on {the|a|your|my|} jacket","put {the|a|your|my} jacket on"],"put on a jacket","Put on — действие (надеть); wear — быть одетым."],
 ["попросить счёт",["ask for {the|a} {bill|check}"],"ask for the bill","Ask for sth — попросить что-то."],
 ["попросить его помочь",["ask him to help[ me]","ask him for help"],"ask him to help","Ask sb to do sth."],
 ["в полной тишине",["in {complete|total|absolute|complete} silence"],"in complete silence","Silence — неисчисляемое; in silence."],
 ["на повышенных тонах",["in raised voices"],"in raised voices","Устойчивое выражение с in."],
 ["высокое здание",["[a ]tall building"],"a tall building","Tall — о людях, зданиях, деревьях (высоких и узких)."],
 ["высокие цены",["high prices"],"high prices","High — о ценах, температуре, горах, заборах."],
 ["его рост",["his height"],"his height","Рост человека — height."],
 ["технически это возможно",["technically it is possible","it is technically possible"],"technically, it is possible","Technically — наречие."],
 ["неискренний комплимент",["[an ]insincere compliment"],"an insincere compliment","Insincere — неискренний."],
 ["за короткий период времени",["{in|over|within} a short period[ of time]"],"in a short period of time","Period of time — промежуток времени."],
 ["удивительно быстро",["surprisingly {fast|quickly}"],"surprisingly fast","Перед наречием — наречие: surprisingly."],
 ["почти всё",["{almost|nearly} everything"],"almost everything","Почти всё — almost everything."],
 ["обсудить это с ним",["discuss {it|this} with him"],"discuss it with him","Discuss sth with sb — без about."],
 ["в прошлый раз",["last time"],"last time","Без артикля и предлога: last time."]
];

/* ---------- Format 2: accurate or not ---------- */
const REASONS=["Tense / aspect","Active / passive","Word choice","Preposition / structure"];
const C2=[
 ["Он высокий — его рост почти два метра.","He is high — his height is almost two metres.",false,2,"О человеке — tall, не high: He is tall."],
 ["Она попросила меня подвезти её до вокзала.","She asked me to give her a lift to the station.",true,null,"Ask sb to do sth; give sb a lift — всё верно."],
 ["Мы обсудили этот эпизод с режиссёром.","We discussed about this episode with the director.",false,3,"Discuss sth — без about: We discussed this episode with the director."],
 ["Говорят, что эпизод был снят в Карелии.","The episode is said to have been filmed in Karelia.",true,null,"Безличный пассив + перфектный пассивный инфинитив — верно."],
 ["Когда я пришёл, в комнате стояла тишина: все уже ушли.","When I came, the room was silent: everyone left.",false,0,"Ушли раньше моего прихода → Past Perfect: everyone had left."],
 ["Он потратил почти все деньги на одежду.","He spent almost all the money for clothes.",false,3,"Spend money on sth: …on clothes."],
 ["Если бы ты тогда примерил эти ботинки, ты бы не совершил ошибку.","If you had tried on these boots then, you wouldn't have made a mistake.",true,null,"Третий тип; try on; make a mistake — верно."],
 ["Удивительно, но у неё до сих пор есть воображаемый друг.","It is surprising, but she still has an imaginable friend.",false,2,"Воображаемый (несуществующий) — imaginary. Imaginable — «вообразимый»."],
 ["Нас попросили подождать.","We asked to wait.",false,1,"Нас попросили → пассив: We were asked to wait."],
 ["Он сказал мне, что это был неискренний ответ.","He said me that it was an insincere answer.",false,3,"Say to sb / tell sb: He told me (said to me) that…"]
];

/* ---------- Format 3: odd one out (last option is the wrong one) ---------- */
const C3=[
 ["Ты не мог бы меня подвезти?",["Could you give me a lift?","Could you give me a ride?","Would you mind giving me a lift?","Could you lift me?"],"Lift sb — поднять кого-то. Подвезти — give sb a lift / a ride."],
 ["В последнее время я трачу слишком много денег на такси.",["Lately I've been spending too much money on taxis.","I've been spending too much on taxis lately.","Recently I've spent too much money on taxis.","Lately I spend too much money for taxis."],"Lately → Present Perfect (Continuous); spend on, не for."],
 ["Не хочу сглазить, но, похоже, всё получится.",["I don't want to endanger the success, but it seems everything will work out.","I don't want to jinx it, but it looks like everything will work out.","Touch wood, but it seems everything will work out.","I don't want to put an evil eye, but everything works out."],"«Put an evil eye» — калька; works out — неверное время (нужно будущее)."],
 ["Его рост — 190 см.",["He is 190 cm tall.","His height is 190 cm.","He is 1.90 metres tall.","He is 190 cm high."],"О росте человека — tall / height, не high."],
 ["Перед тем как купить пальто, примерь его.",["Try the coat on before you buy it.","Try on the coat before buying it.","Before buying the coat, try it on.","Put on the coat before you will buy it."],"Примерить — try on; после before (время) — не will."],
 ["Говорят, что сериал основан на реальных событиях.",["The series is said to be based on real events.","It is said that the series is based on real events.","They say the series is based on real events.","The series is said to base on real events."],"Основан — пассив: to be based on."],
 ["Она попросила меня никому не говорить.",["She asked me not to tell anyone.","She asked me not to say anything to anyone.","She asked me to tell no one.","She asked me don't tell anyone."],"Ask sb (not) to do sth — с инфинитивом."],
 ["К тому времени, как мы приехали, эпизод уже закончился.",["By the time we arrived, the episode had already finished.","The episode had already ended by the time we arrived.","When we arrived, the episode had already finished.","By the time we arrived, the episode has already finished."],"Раньше другого действия в прошлом → Past Perfect (had finished)."]
];

/* ---------- Format 4: first letters ---------- */
const C4=[
 ["Технически это была не моя ошибка, но я взял на себя ответственность.","Technically, it was not my mistake, but I took responsibility."],
 ["Её неискренняя улыбка удивила всех.","Her insincere smile surprised everyone."],
 ["Мы ехали в полной тишине, пока он наконец не попросил меня включить музыку.","We drove in complete silence until he finally asked me to turn on the music."],
 ["Если бы ты вчера сделал домашнее задание, ты бы сейчас не волновался.","If you had done your homework yesterday, you would not be worried now."],
 ["Этот эпизод вряд ли понравится зрителям.","This episode is unlikely to be liked by the audience."],
 ["Говорят, что красота этого места почти не изменилась за последние сто лет.","It is said that the beauty of this place has hardly changed in the last hundred years."],
 ["Прочитав описание, он понял, что совершил ошибку.","Having read the description, he realised that he had made a mistake."],
 ["В прошлый раз я потерял нить разговора, потому что все говорили на повышенных тонах.","Last time I lost the thread of the conversation because everyone was speaking in raised voices."]
];

/* ---------- Format 5: translation decisions ---------- */
const C5=[
 ["Мы ждали тебя уже час, когда ты наконец позвонил.",
  ["Which tense for «ждали уже час»?",["Past Perfect Continuous","Past Continuous","Present Perfect Continuous"],0,"Длилось до момента в прошлом (позвонил) → Past Perfect Continuous."],
  ["«ждать тебя» =",["wait for you","wait you","expect you"],0,"Wait for sb."],
  ["we had [already ]been waiting for you for an hour[ already] when you finally {called|rang|phoned}[ us]"],"We had been waiting for you for an hour when you finally called."],
 ["Ожидается, что новый эпизод выйдет в пятницу.",
  ["Which structure for «ожидается»?",["is expected to (impersonal passive)","Future Continuous","be about to"],0,"Безличный пассив: is expected to + V."],
  ["«выйдет» (о сериале) =",["come out","go out","get out"],0,"Come out — выйти (о фильме, книге, эпизоде)."],
  ["the new episode is expected to {come out|be released} on friday","it is expected that the new episode will {come out|be released} on friday"],"The new episode is expected to come out on Friday."],
 ["Если бы она вчера попросила меня, я бы её подвёз.",
  ["Which conditional?",["Third conditional","Second conditional","Mixed conditional"],0,"Оба действия в прошлом (вчера) → третий тип."],
  ["«подвёз её» =",["given her a lift","lifted her","driven her up"],0,"Give sb a lift."],
  ["{if she had asked me yesterday|had she asked me yesterday|if she had asked me|had she asked me} i would have given her a {lift|ride}[ yesterday]"],"If she had asked me yesterday, I would have given her a lift."],
 ["Купив новую куртку, он сразу её надел.",
  ["Which structure for «купив»?",["Having + V3","Present Perfect","Being + V3"],0,"Одно действие раньше другого → Having bought."],
  ["«надел её» =",["put it on","wore it","dressed it"],0,"Put on — надеть (действие); wear — носить."],
  ["having bought a new jacket he {immediately put it on|put it on immediately|put it on at once|put it on straight away|put it on right away}"],"Having bought a new jacket, he put it on immediately."],
 ["Поезд вот-вот отправится — у нас нет времени это обсуждать.",
  ["Which structure for «вот-вот»?",["be about to","be due to","Present Continuous"],0,"Be about to — вот-вот."],
  ["«обсуждать это» =",["discuss it","discuss about it","discuss over it"],0,"Discuss sth — без предлога."],
  ["the train is about to {leave|depart|go} we {do not have|have no|have not got} time to discuss {it|this}"],"The train is about to leave — we don't have time to discuss it."],
 ["Говорят, что в последнее время он тратит много денег на одежду.",
  ["Which infinitive after «is said»?",["to have been spending","to spend","to have spent"],0,"Длится в последнее время и сейчас → перфектно-длительный инфинитив."],
  ["«на одежду» =",["on clothes","for clothes","to clothes"],0,"Spend money on sth."],
  ["he is said to have been spending {a lot of|lots of|much} money on clothes[ lately][ recently]","{lately|recently} he is said to have been spending {a lot of|lots of|much} money on clothes","it is said that {lately |recently |}he has been spending {a lot of|lots of|much} money on clothes[ lately][ recently]"],"He is said to have been spending a lot of money on clothes lately."]
];

/* ---------- Format 6: fix the machine translation ---------- */

/* ======================= CHECKING ======================= */
const SPELL={realise:"realize",realised:"realized",neighbour:"neighbor",neighbours:"neighbors",cancelling:"canceling",cancelled:"canceled",quarrelling:"quarreling",favour:"favor",gotten:"got",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",nine:"9",eight:"8",ten:"10",fifteenth:"15th",xv:"15th"};
const spellRe=new RegExp("\\b("+Object.keys(SPELL).join("|")+")\\b","g");
const PP=/^(been|had|made|got|done|gone|come|left|felt|kept|said|told|stuck|bought|thought|brought|built|sent|spent|lost|met|paid|heard|put|let|set|seen|known|taken|given|written|already|never|just|finished|\w+ed)$/;
function baseClean(s){return s.toLowerCase().replace(/[’`ʼ]/g,"'").replace(/[-–—]/g," ").replace(/[.,!?;:"“”«»…()]/g," ").replace(/o'clock/g,"oclock").replace(spellRe,m=>SPELL[m]).replace(/\s+/g," ").trim();}
function normInput(s){
  s=baseClean(s).replace(/won't/g,"will not").replace(/can't/g,"cannot").replace(/can not/g,"cannot").replace(/n't/g," not").replace(/'ll/g," will").replace(/'re/g," are").replace(/'ve/g," have").replace(/'m/g," am");
  const t=s.split(" ");
  for(let i=0;i<t.length;i++){
    const m=t[i].match(/^(\w+)'(d|s)$/);if(!m)continue;const nx=t[i+1]||"";
    if(m[2]==="d")t[i]=m[1]+(nx==="better"||PP.test(nx)?" had":" would");
    else if(/^(due|likely|unlikely|about|expected|said|believed|thought|going|on)$/.test(nx))t[i]=m[1]+" is";
    else if(["it","that","there","what","who","he","she","where","here"].includes(m[1]))t[i]=m[1]+(/^(been|got|gone|had|come|never)$/.test(nx)?" has":" is");
  }
  return t.join(" ").replace(/'/g,"").replace(/\s/g,"");
}
function patRe(p){
  p=baseClean(p.replace(/[{}\[\]|]/g,c=>({"{":"\u0001","}":"\u0002","[":"\u0003","]":"\u0004","|":"\u0005"}[c]))).replace(/'/g,"").replace(/\s/g,"");
  let r="";for(const c of p){r+=c==="\u0001"?"(?:":c==="\u0002"?")":c==="\u0003"?"(?:":c==="\u0004"?")?":c==="\u0005"?"|":c.replace(/[.*+?^$()\\\/]/g,"\\$&");}
  return new RegExp("^"+r+"$");
}
function matches(input,patterns){const v=normInput(input);if(!v)return null;return patterns.some(p=>patRe(p).test(v));}

const $=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}kids.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e;};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const scores={};
function scoreEl(id,total){const s=$("span",{class:"meta"});scores[id]={ok:new Set(),total,el:s};upd(id);return s;}
function upd(id){const s=scores[id];s.el.textContent=`${s.ok.size} / ${s.total} correct`;}
function mark(id,i){scores[id]&&(scores[id].ok.add(i),upd(id));}
function numRow(i,node){return $("div",{class:"q"},$("span",{class:"num"},String(i+1)),node);}
const model=(t,n)=>`<div class="model">${esc(t)}${n?`<small>${n}</small>`:""}</div>`;
function setState(el,st){el.classList.remove("ok-f","bad-f");if(st===true)el.classList.add("ok-f");if(st===false)el.classList.add("bad-f");}

const good=t=>`<span class="good">Correct.</span>${t?` <span class="ru">${t}</span>`:""}`;
const bad=t=>`<span class="wrong">Not quite.</span>${t?` <span class="ru">${t}</span>`:""}`;
function inputItem(id,i,inpAttrs,patterns,hint,onOk){
  const inp=$(inpAttrs.tag||"input",Object.assign({class:inpAttrs.tag?"":"gap wide",type:"text",autocomplete:"off",autocapitalize:"off",spellcheck:"false",id:id+"-"+i},inpAttrs.attrs||{}));
  const fb=$("div",{class:"fb"});
  const check=()=>{const r=matches(inp.value,patterns);if(r===null)return;setState(inp,r);fb.innerHTML=r?good(hint):bad("Подсказка: "+hint);if(r){mark(id,i);onOk&&onOk();}};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();check();}});
  return {inp,fb,check};
}

/* ======================= RENDER ======================= */
const tabs=document.getElementById("tabs"),panels=document.getElementById("panels");const tbtn=[],pans=[];
SECTIONS.forEach((s,idx)=>{
  const b=$("button",{role:"tab","aria-selected":"false",id:"t-"+s.id},$("span",{class:"n"},String(idx+1)),s.title);b.onclick=()=>show(idx);tabs.append(b);tbtn.push(b);
  const list=$("div",{class:"list"});const metaWrap=$("div",{style:"display:flex;gap:14px;flex-wrap:wrap"},$("span",{class:"meta"},"Format "+(idx+1)+" · ≈ "+s.mins+" min"));
  const p=$("section",{class:"panel",role:"tabpanel",id:s.id},$("div",{class:"phead"},$("h2",{},s.title),metaWrap),$("p",{class:"instr"},s.instr),list);
  const total=s.build(list);if(total)metaWrap.append(scoreEl(s.id,total));
  const nav=$("div",{class:"foot"});
  nav.append(idx>0?$("button",{class:"btn",onclick:()=>show(idx-1)},"← "+SECTIONS[idx-1].title):$("span"));
  if(idx<SECTIONS.length-1)nav.append($("button",{class:"btn solid",onclick:()=>show(idx+1)},SECTIONS[idx+1].title+" →"));
  p.append(nav);p.hidden=true;panels.append(p);pans.push(p);
});
function show(i){tbtn.forEach((b,k)=>b.setAttribute("aria-selected",k===i?"true":"false"));pans.forEach((p,k)=>p.hidden=k!==i);tbtn[i].scrollIntoView({block:"nearest",inline:"nearest"});window.scrollTo({top:0});try{localStorage.setItem("vit-1410-tab",i)}catch(e){}}
let start=0;try{const v=+localStorage.getItem("vit-1410-tab");if(v>=0&&v<SECTIONS.length)start=v;}catch(e){}
const hi=SECTIONS.findIndex(s=>s.id===location.hash.slice(1));if(hi>=0)start=hi;
show(start);
