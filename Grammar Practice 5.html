*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:22px 0 18px}

nav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px}

main{padding:20px 0 60px}
.page{display:none}.page.active{display:block}

.opts.inline{flex-direction:row;flex-wrap:wrap}

.text{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--line);line-height:2.4;margin-bottom:14px}
.text h3{margin:0 0 6px;line-height:1.4}

.choice:hover{border-color:var(--accent)}
.choice.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}

.pair .q-ans{margin-left:4px;padding:0 7px}
.rubr{background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:6px;padding:1px 6px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 0}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.chip{background:var(--tile);color:var(--tile-ink);border-radius:999px;padding:4px 12px;font-weight:500}
.chip.used{opacity:.45;text-decoration:line-through}
@media (max-width:600px){.pair{white-space:normal}}
.need{display:inline-block;margin-left:6px;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;vertical-align:middle}
.opt.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opt.sel.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.sel.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default;opacity:.85}
.hunt .body{line-height:2}
.hunt .w{cursor:pointer;border-radius:4px;padding:1px 1px}
.hunt .w:hover{background:var(--accent-soft)}
.hunt .w.miss{background:var(--bad-soft);color:var(--bad)}
.hunt .w.hit{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.hunt .w.shown{background:var(--info-soft);color:var(--info);text-decoration:line-through}
.hunt .corr{color:var(--ok);font-weight:700}
.hunt .cnt{font-weight:400;color:var(--muted);font-size:.9rem}
.found,.misses{font-size:.9rem;color:var(--muted)}
.chain{margin:10px 0 0 26px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:c}
.chain li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--field);counter-increment:c}
.chain li::before{content:counter(c)".";color:var(--accent);font-weight:700}
.chain li .ln{flex:1}
.chain li.off{border-color:var(--bad);background:var(--bad-soft)}
.chain .mv{display:flex;gap:4px}
.chain .btn:disabled{opacity:.3;cursor:default}
.purse{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;display:inline-block;background:#4f46e5;color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;margin-bottom:12px}
.prompt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem}
input.wide{flex:1;min-width:260px}
@media (max-width:600px){.chain{margin-left:0}input.wide{min-width:0}}
.xw{cursor:pointer;border-radius:4px;padding:1px 3px}
.xw:hover{background:var(--accent-soft)}
.xw.miss{background:var(--bad-soft);color:var(--bad)}
.xw.gone{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.dlgbox p{margin:0 0 6px}
.dlgbox{line-height:2.3}
.gap{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.gap .gn{font-size:.75rem;color:var(--accent);font-weight:700}
.gap input{min-width:0;width:175px;padding:3px 7px;line-height:1.3}
.gap button{padding:3px 7px;font-size:.72rem}
.gap input.okc{border-color:var(--ok);background:var(--ok-soft)}
.gap input.badc{border-color:var(--bad);background:var(--bad-soft)}
.gap input.infoc{border-color:var(--info-line);background:var(--info-soft)}
.item select{margin:0 4px}
@media (max-width:600px){.gap{white-space:normal}.gap input{width:120px}}
</style>

<script>
/* ================= DATA ================= */
const EX = [
{
 id:"reply", title:"1. Best Reply", type:"mc",
 intro:"Read what person A says. Choose the best reply for person B: it must be grammatically correct and make sense in the situation.",
 items:[
  {q:"A: Why are your hands covered in paint?", o:["I paint the fence.","I've been painting the fence.","I'm going to paint the fence."], a:1,
   en:"A recent activity with a visible result (paint on the hands) → Present Perfect Continuous.", ru:"Недавнее действие с видимым результатом (краска на руках) → Present Perfect Continuous."},
  {q:"A: Shall we go? It's already eleven o'clock.", o:["Yes, it's high time we went.","Yes, it's high time we go.","Yes, it's high time we had gone."], a:0,
   en:"It's high time + subject + Past Simple.", ru:"It's high time + подлежащее + Past Simple."},
  {q:"A: Is it true that the old factory will be closed?", o:["Yes, it's on the verge to close.","Yes, it's to close by the owners next month.","Yes, it's to be closed next month."], a:2,
   en:"be to + passive infinitive (to be closed): an official plan. The factory doesn't close itself here, the owners close it.", ru:"be to + пассивный инфинитив (to be closed) — официальный план. Фабрику закрывают, поэтому нужен пассив."},
  {q:"A: Do you know who painted this picture?", o:["It's believed to paint by a student of Rembrandt.","It's believed to have been painted by a student of Rembrandt.","It's believed that painted by a student of Rembrandt."], a:1,
   en:"The picture was painted (passive) long ago → perfect passive infinitive: to have been painted.", ru:"Картину написали (пассив) давно → перфектный пассивный инфинитив: to have been painted."},
  {q:"A: It's so stuffy in here!", o:["Would you mind opening the window?","Would you mind to open the window?","Would you mind if you open the window?"], a:0,
   en:"Would you mind + V-ing — a polite request.", ru:"Would you mind + V-ing — вежливая просьба."},
  {q:"A: Did you manage to fix the car yesterday?", o:["No, I couldn't to find the problem.","No, I didn't can find the problem.","No, I wasn't able to find the problem."], a:2,
   en:"Past of be able to: wasn't able to + V1. ‘couldn't to’ and ‘didn't can’ don't exist.", ru:"Прошедшее время be able to: wasn't able to + V1. Форм couldn't to и didn't can не существует."},
  {q:"A: Why didn't you come to the party last night?", o:["If I had known about it, I would have come.","If I knew about it, I would come.","If I would have known about it, I would have come."], a:0,
   en:"Third conditional about last night: if + Past Perfect → would have + V3.", ru:"Третий тип (речь о вчерашнем вечере): if + Past Perfect → would have + V3."},
  {q:"A: Why is Jack so tired today?", o:["If he didn't stay up so late, he wouldn't have been so tired.","If he hadn't stayed up so late, he wouldn't be so tired.","If he hadn't stayed up so late, he won't be so tired."], a:1,
   en:"Mixed conditional: past action (stayed up late) → present result (tired today).", ru:"Смешанное условное: действие в прошлом (поздно лег) → результат сейчас (устал сегодня)."},
  {q:"A: Are you going to the beach tomorrow?", o:["Yes, if it won't rain.","Yes, if it doesn't rain.","Yes, if it didn't rain."], a:1,
   en:"First conditional: if + Present Simple (no will).", ru:"Первый тип: if + Present Simple, без will."},
  {q:"A: You look upset. What's wrong?", o:["I've lost my keys. If only I would be more careful!","I've lost my keys. If only I was more careful yesterday!","I've lost my keys. If only I had been more careful!"], a:2,
   en:"Regret about the past → If only + Past Perfect.", ru:"Сожаление о прошлом → If only + Past Perfect."},
  {q:"A: Have you signed the contract yet?", o:["Not yet, but we're on the verge of signing it.","Not yet, but we're on the verge to sign it.","Not yet, but we're on the verge sign it."], a:0,
   en:"on the verge of + V-ing.", ru:"on the verge of + V-ing."},
  {q:"A: Did you read the letter from the bank?", o:["Yes. Read it twice, I still don't understand it.","Yes. Having read it twice, I still don't understand it.","Yes. Being read it twice, I still don't understand it."], a:1,
   en:"Perfect participle (active): I read it first, and the result is now.", ru:"Перфектное причастие (активный залог): сначала прочитал, результат — сейчас."}
 ]
},
{
 id:"pair", title:"2. Choose the Pair", type:"mc",
 intro:"Each sentence has two gaps. Choose the pair of words that completes BOTH gaps correctly.",
 items:[
  {q:"If you ___ me earlier, I ___ you.", o:["had told / would have helped","told / would have helped","would tell / would have helped"], a:0,
   en:"Third conditional: if + Past Perfect → would have + V3.", ru:"Третий тип: if + Past Perfect → would have + V3."},
  {q:"She ___ in this flat ___ 2020.", o:["is living / since","has been living / for","has been living / since"], a:2,
   en:"Present Perfect Continuous + since + a point in time.", ru:"Present Perfect Continuous + since + момент времени (2020)."},
  {q:"The thief ___ to ___ the country yesterday.", o:["reports / have left","is reported / have left","is reported / leave"], a:1,
   en:"Personal passive + perfect infinitive: the leaving happened before the report (yesterday).", ru:"Личная пассивная конструкция + перфектный инфинитив: уехал раньше, чем об этом сообщили (yesterday)."},
  {q:"If I ___ more money, I ___ a bigger flat.", o:["had / would rent","have / would rent","had / will rent"], a:0,
   en:"Second conditional: if + Past Simple → would + V1.", ru:"Второй тип: if + Past Simple → would + V1."},
  {q:"___ for two hours, we ___ a break.", o:["Walked / took","Having been walked / took","Having walked / took"], a:2,
   en:"Perfect participle (active): first we walked, then we took a break.", ru:"Перфектное причастие (активный залог): сначала шли, потом сделали перерыв."},
  {q:"It's high time the council ___ something about the roads. They ___ terrible for years.", o:["did / have been","does / have been","did / are"], a:0,
   en:"It's high time + Past Simple. for years (up to now) → Present Perfect.", ru:"It's high time + Past Simple. for years (до сих пор) → Present Perfect."},
  {q:"Would you mind ___ quiet? The baby ___.", o:["to keep / is sleeping","keeping / is sleeping","keeping / sleeps"], a:1,
   en:"Would you mind + V-ing. The baby is sleeping right now → Present Continuous.", ru:"Would you mind + V-ing. Ребенок спит прямо сейчас → Present Continuous."},
  {q:"If he ___ so stubborn, he ___ the argument last night.", o:["hadn't been / wouldn't start","weren't / wouldn't start","weren't / wouldn't have started"], a:2,
   en:"Mixed conditional: permanent quality (stubborn) → past result (last night).", ru:"Смешанное условное: постоянное качество (упрямый) → результат в прошлом (last night)."},
  {q:"The new bridge ___ to ___ by the mayor next week.", o:["is / be opened","is / open","will / be opened"], a:0,
   en:"be to + passive infinitive: the bridge is opened by the mayor (official plan).", ru:"be to + пассивный инфинитив: мост откроет мэр (официальный план)."},
  {q:"I ___ to sleep last night because my neighbours ___ a party.", o:["couldn't / were having","wasn't able / were having","wasn't able / have had"], a:1,
   en:"wasn't able to + V1 (couldn't is not followed by to). A party in progress at that time → Past Continuous.", ru:"wasn't able to + V1 (после couldn't не ставится to). Вечеринка шла в тот момент → Past Continuous."},
  {q:"If only you ___ shouting! I ___ think.", o:["will stop / can't","would stop / can't to","would stop / can't"], a:2,
   en:"If only + would: annoyance about someone's behaviour. can't + V1 without to.", ru:"If only + would — раздражение из-за чужого поведения. can't + V1 без to."},
  {q:"The car ___ on the verge of ___ down, so we sold it.", o:["was / breaking","was / break","has been / breaking"], a:0,
   en:"on the verge of + V-ing. The story is in the past (sold) → was.", ru:"on the verge of + V-ing. Речь о прошлом (sold) → was."}
 ]
},
{
 id:"where", title:"3. Which Goes Where?", type:"where",
 intro:"Each pair of sentences has two options. Decide which option goes into which sentence. Each option is used once.",
 items:[
  {o:["had studied","studied"], s:["If I ___ harder last year, I would have passed the exam.","If I ___ harder, I would get better marks."], a:[0,1],
   en:"Past (last year) → Past Perfect, third conditional. Present/future → Past Simple, second conditional.", ru:"Прошлое (last year) → Past Perfect, третий тип. Настоящее/будущее → Past Simple, второй тип."},
  {o:["to have been built","to be built"], s:["The old bridge is thought ___ by the Romans.","A new bridge is expected ___ next year."], a:[0,1],
   en:"Past event → perfect passive infinitive. Future event → simple passive infinitive.", ru:"Событие в прошлом → перфектный пассивный инфинитив. В будущем → простой пассивный инфинитив."},
  {o:["have read","have been reading"], s:["I ___ three books this month.","I ___ this book all afternoon."], a:[0,1],
   en:"How many (three books) → Present Perfect Simple. How long (all afternoon) → Present Perfect Continuous.", ru:"Сколько (three books) → Present Perfect Simple. Как долго (all afternoon) → Present Perfect Continuous."},
  {o:["would be","would have been"], s:["If I hadn't missed the bus, I ___ at home now.","If I hadn't missed the bus, I ___ on time for the meeting yesterday."], a:[0,1],
   en:"Result now → would be (mixed). Result in the past → would have been (third).", ru:"Результат сейчас → would be (смешанное). Результат в прошлом → would have been (третий тип)."},
  {o:["Having finished","Finished"], s:["___ the test, she handed it in.","___ in 1889, the Eiffel Tower is now a symbol of Paris."], a:[0,1],

/* ================= HELPERS ================= */
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”".,!?;:—–-]/g," ")
    .replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/n't\b/g," not")
    .replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'re\b/g," are").replace(/'m\b/g," am")
    .replace(/\s+/g," ").trim();
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const state={}, given={};          // state: solved | revealed ; given: student's last answer
const K=(ex,i)=>ex+"-"+i;


function mark(exId,i,d,how){
  const k=K(exId,i);
  if(how==="solved" && state[k]!=="revealed"){state[k]="solved"; d.classList.add("solved");}
  if(how==="revealed" && state[k]!=="solved"){state[k]="revealed"; d.classList.add("revealed");}
  totals();
}
// feedback box: kind ok|bad|info; English explanation visible, Russian behind RUS
function feedback(fb,kind,head,it,full){
  fb.className="fb "+kind;
  fb.innerHTML=`<b>${head}</b><span class="en">${esc(it.en)}</span><span class="ru" hidden>${esc(it.ru)}</span>
    <span class="fbtools"><button class="btn small" data-act="rus">RUS</button></span>`;
  fb.querySelector('[data-act="rus"]').onclick=()=>{const r=fb.querySelector(".ru"); r.hidden=!r.hidden;};
}
function totals(){
  let all=0,ok=0;
  EX.forEach(ex=>{
        let s=0; ex.items.forEach((_,i)=>{if(state[K(ex.id,i)]==="solved") s++;});
    all+=ex.items.length; ok+=s;
    const m=document.getElementById("mini-"+ex.id); if(m) m.textContent=`${s}/${ex.items.length}`;
  });
  document.getElementById("totalScore").textContent=`Score: ${ok} / ${all}`;
}
function itemBox(ex,i,inner){
  const d=document.createElement("div"); d.className="item"; d.id="it-"+K(ex.id,i); d.innerHTML=inner; return d;
}

/* ================= BUILDERS ================= */
const L=j=>String.fromCharCode(97+j);
function buildMC(ex,p){
  ex.items.forEach((it,i)=>{
    const d=itemBox(ex,i,`<div class="q"><span class="n">${i+1}.</span>${esc(it.q).replace(/___/g,"<b>_____</b>")}</div>
      <div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}">${L(j)}) ${esc(o)}</button>`).join("")}</div>
      <div class="row"><button class="btn ans">Answer</button></div><div class="fb"></div>`);
    const opts=d.querySelectorAll(".opt"), fb=d.querySelector(".fb");
    opts.forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; given[K(ex.id,i)]=L(j);
      if(j===it.a){opts.forEach(x=>x.classList.remove("wrong")); b.classList.add("right"); feedback(fb,"ok","✓ Correct!",it,null); mark(ex.id,i,d,"solved");}
      else {b.classList.add("wrong"); feedback(fb,"bad","✗ Not quite. Try another option.",it,null);}
    });
    d.querySelector(".ans").onclick=()=>{opts[it.a].classList.add("right");
      feedback(fb,"info",`Answer: ${L(it.a)}) ${esc(it.o[it.a])}`,it,null); mark(ex.id,i,d,"revealed");};
    p.appendChild(d);
  });
}
function buildWhere(ex,p){
  ex.items.forEach((it,i)=>{
    const sel=k=>`<select id="sel-${K(ex.id,i)}-${k}"><option value="">— choose —</option>${it.o.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join("")}</select>`;
    const d=itemBox(ex,i,`<div class="q"><span class="n">${i+1}.</span>Options: ${it.o.map(o=>`<span class="chip">${esc(o)}</span>`).join(" ")}</div>
      ${it.s.map((s,k)=>`<div class="sit" style="font-style:normal;color:var(--ink);margin-top:8px">${String.fromCharCode(65+k)}. ${esc(s).replace("___",sel(k))}</div>`).join("")}
      <div class="row"><button class="btn check">Check</button><button class="btn ans">Answer</button></div><div class="fb"></div>`);
    const sels=d.querySelectorAll("select"), fb=d.querySelector(".fb");
    sels.forEach(s=>s.onchange=()=>{given[K(ex.id,i)]=[...sels].map((x,k)=>String.fromCharCode(65+k)+": "+(x.value===""?"—":it.o[+x.value])).join("; ");});
    d.querySelector(".check").onclick=()=>{
      if([...sels].some(s=>s.value==="")){fb.className="fb bad"; fb.innerHTML="<b>Choose an option for both sentences.</b>"; return;}
      if(sels[0].value===sels[1].value){fb.className="fb bad"; fb.innerHTML="<b>Each option is used once. Choose a different option for each sentence.</b>"; return;}
      const ok=[...sels].every((s,k)=>+s.value===it.a[k]);
      if(ok){feedback(fb,"ok","✓ Correct!",it,null); mark(ex.id,i,d,"solved");}
      else feedback(fb,"bad","✗ Not quite. Swap the options and think about the time and meaning of each sentence.",it,null);
    };
    d.querySelector(".ans").onclick=()=>{sels.forEach((s,k)=>s.value=String(it.a[k]));
      feedback(fb,"info","Answer: "+it.s.map((s,k)=>String.fromCharCode(65+k)+" — "+esc(it.o[it.a[k]])).join(", "),it,null); mark(ex.id,i,d,"revealed");};
    p.appendChild(d);
  });
}
function buildExtra(ex,p){
  ex.items.forEach((it,i)=>{
    const words=it.w.split(" ");
    const d=itemBox(ex,i,`<div class="q"><span class="n">${i+1}.</span><span class="words">${words.map((w,k)=>`<span class="xw" data-k="${k}">${esc(w)}</span>`).join(" ")}</span></div>
      <div class="row"><button class="btn ans">Answer</button></div><div class="fb"></div>`);
    const fb=d.querySelector(".fb"), ws=d.querySelectorAll(".xw"); let done=false;
    ws.forEach(s=>s.onclick=()=>{
      if(done) return; const k=+s.dataset.k; given[K(ex.id,i)]=words[k];
      if(k===it.x){done=true; s.classList.add("gone"); feedback(fb,"ok","✓ Correct! "+esc(it.fix),it,null); mark(ex.id,i,d,"solved");}
      else {s.classList.add("miss"); feedback(fb,"bad","✗ This word is needed. Look for another one.",it,null);}
    });
    d.querySelector(".ans").onclick=()=>{if(done) return; done=true; ws[it.x].classList.add("gone");
      feedback(fb,"info","Answer: “"+esc(words[it.x])+"”. "+esc(it.fix),it,null); mark(ex.id,i,d,"revealed");};
    p.appendChild(d);
  });
}
function buildDlgType(ex,p){
  const box=document.createElement("div"); box.className="text dlgbox";
  box.innerHTML=ex.lines.map(([sp,t])=>`<p><span class="speaker">${esc(sp)}:</span> ${esc(t).replace(/\{(\d+)\}/g,(m,n)=>
    `<span class="gap"><span class="gn">(${+n+1})</span><input type="text" id="in-${K(ex.id,+n)}" data-g="${n}" autocomplete="off" spellcheck="false"><button class="btn check" data-c="${n}">✓</button><button class="btn ans" data-a="${n}">?</button></span>`)}</p>`).join("");
  p.appendChild(box);
  const bar=document.createElement("div"); bar.className="row"; bar.style.paddingLeft="0";
  bar.innerHTML=`<button class="btn check" id="dlgAll">Check all gaps</button><span style="color:var(--muted);font-size:.85rem">✓ = check a gap · ? = show the answer</span>`;
  p.appendChild(bar);
  const fbw=document.createElement("div"); fbw.className="item"; fbw.innerHTML=`<div class="fb" style="margin-left:0"></div><p class="hint">Check a gap to see the explanation here.</p>`;
  p.appendChild(fbw);
  const fb=fbw.querySelector(".fb"), hint=fbw.querySelector(".hint");
  const gapEl=i=>box.querySelector(`.gap input[data-g="${i}"]`).parentElement;
  const checkGap=(i,quiet)=>{
    const inp=box.querySelector(`input[data-g="${i}"]`), it=ex.items[i];
    inp.classList.remove("okc","badc");
    if(matches(inp.value,it.a)){inp.classList.add("okc"); mark(ex.id,i,gapEl(i),"solved");
      if(!quiet){hint.hidden=true; feedback(fb,"ok",`✓ (${i+1}) Correct!`,it,null);} return true;}
    if(inp.value.trim()) inp.classList.add("badc");
    if(!quiet){hint.hidden=true; feedback(fb,"bad",`✗ (${i+1}) Not quite. Try again.`,it,null);}
    return false;
  };
  box.querySelectorAll("input[data-g]").forEach(inp=>{
    inp.oninput=()=>{given[K(ex.id,+inp.dataset.g)]=inp.value.trim();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkGap(+inp.dataset.g);});
  });
  box.querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>checkGap(+b.dataset.c));
  box.querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.a, it=ex.items[i], inp=box.querySelector(`input[data-g="${i}"]`);
    inp.value=it.a[0]; inp.classList.remove("okc","badc"); inp.classList.add("infoc"); given[K(ex.id,i)]=it.a[0];
    hint.hidden=true; feedback(fb,"info",`(${i+1}) Answer: ${it.a.map(esc).join(" / ")}`,it,null); mark(ex.id,i,gapEl(i),"revealed");
  });
  bar.querySelector("#dlgAll").onclick=()=>{
    const wrong=[]; ex.items.forEach((_,i)=>{if(!checkGap(i,true)) wrong.push(i+1);});
    hint.hidden=true; fb.className=wrong.length?"fb bad":"fb ok";
    fb.innerHTML=wrong.length?`<b>${ex.items.length-wrong.length} / ${ex.items.length} correct.</b><span class="en">Check gaps: ${wrong.join(", ")}.</span>`:`<b>✓ All ${ex.items.length} gaps are correct!</b>`;
  };
}
function matches(input,answers){const n=norm(input); return n!=="" && answers.some(a=>norm(a)===n);}


/* ================= PAGE ================= */
const tabs=document.getElementById("tabs"), pages=document.getElementById("pages");
const B={mc:buildMC,where:buildWhere,extra:buildExtra,dlgtype:buildDlgType};
EX.forEach(ex=>{
  const b=document.createElement("button"); b.id="tab-"+ex.id;
  b.innerHTML=`${ex.title}<span class="mini" id="mini-${ex.id}"></span>`; b.onclick=()=>show(ex.id); tabs.appendChild(b);
  const p=document.createElement("section"); p.className="page"; p.id="page-"+ex.id;
  p.innerHTML=`<div class="intro"><h2>${ex.title}</h2><p>${ex.intro}</p></div>`;
  B[ex.type](ex,p);
  if(true){
    const t=document.createElement("div"); t.className="tools";
    t.innerHTML=`<button class="btn copy">Copy my answers</button><button class="btn reset">Reset this exercise</button><span class="copied" hidden>Copied!</span>`;
    t.querySelector(".copy").onclick=()=>copyAnswers(ex,t.querySelector(".copied"));
    t.querySelector(".reset").onclick=()=>resetEx(ex);
    p.appendChild(t);
  }
  pages.appendChild(p);
});
function copyAnswers(ex,flag){
  const lines=[ex.title];
  ex.items.forEach((it,i)=>{
    const a=given[K(ex.id,i)]||"—"; const st=state[K(ex.id,i)];
    lines.push(`${i+1}. ${a}${st==="solved"?" ✓":st==="revealed"?" (answer shown)":""}`);
  });
  const text=lines.join("\n");
  const done=()=>{flag.hidden=false; setTimeout(()=>flag.hidden=true,1800);};
  const fallback=()=>{const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy");}catch(e){} ta.remove(); done();};
  try{ navigator.clipboard.writeText(text).then(done,fallback); }catch(e){ fallback(); }
}
function resetEx(ex){
  ex.items.forEach((_,i)=>{delete state[K(ex.id,i)]; delete given[K(ex.id,i)];});
  const page=document.getElementById("page-"+ex.id); const fresh=document.createElement("section");
  fresh.className=page.className; fresh.id=page.id; fresh.innerHTML=`<div class="intro"><h2>${ex.title}</h2><p>${ex.intro}</p></div>`;
  B[ex.type](ex,fresh);
  const tools=page.querySelector(".tools"); fresh.appendChild(tools); page.replaceWith(fresh); totals();
}
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id==="page-"+id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.id==="tab-"+id));
  window.scrollTo({top:0});
}
show(EX[0].id); totals();
</script>
